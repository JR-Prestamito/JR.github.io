<style>
  :root{ --navy:#1B2A4A; --gold:#C9973E; --cream:#F7F5F0; }
  *{box-sizing:border-box;}
  /* Evita que "jalar hacia abajo" en la parte de arriba de la pantalla dispare el gesto
     nativo de "deslizar para recargar" del navegador/Chrome, que recarga toda la página
     (y por lo tanto saca al usuario de la pantalla en la que estaba). overscroll-behavior
     en html/body es lo que controla ese gesto a nivel de navegador. */
  html{overscroll-behavior-y:contain;}
  #pull-refresh-indicator{position:fixed;top:0;left:50%;transform:translate(-50%,-100%);background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:0 0 12px 12px;z-index:9999;display:flex;align-items:center;gap:8px;transition:transform .18s ease,opacity .18s ease;opacity:0;pointer-events:none;}
  #pull-refresh-indicator.mostrando{transform:translate(-50%,0);opacity:1;}
  #pull-refresh-indicator .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:pr-spin .7s linear infinite;}
  @keyframes pr-spin{to{transform:rotate(360deg);}}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:#222;overscroll-behavior-y:contain;}
  #app{max-width:420px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:70px;background:var(--cream);overscroll-behavior-y:contain;}
  header{background:var(--navy);padding:calc(20px + env(safe-area-inset-top)) 16px 16px;}
  header p{color:rgba(255,255,255,.7);font-size:11px;margin:0 0 2px;letter-spacing:.03em;}
  header h1{color:#fff;font-size:19px;margin:0;font-weight:600;}
  .content{padding:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .card{border-radius:16px;padding:14px;}
  .card .lbl{font-size:12px;color:#8a8680;margin:0 0 4px;}
  .card .val{font-size:18px;font-weight:600;margin:0;}
  .section-title{font-size:13px;font-weight:600;color:#8a8680;margin:0 0 8px;}
  .row-card{border:1px solid #e5e1d8;border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:#fff;}
  .monto-navy{color:var(--navy);}
  /* Las notas de ayuda (envueltas en <details class="nota-ayuda-details">) quedan cerradas
     por defecto en cada sección por separado — cada una se abre/cierra independiente de las
     demás, sin necesidad de JavaScript (es el comportamiento nativo de <details>). */
  .nota-ayuda-details{margin-top:6px;}
  .nota-ayuda-details summary{list-style:revert;cursor:pointer;font-size:12px;font-weight:600;color:#8a8680;padding:0;display:list-item;}
  .nota-ayuda-details[open] summary{margin-bottom:2px;}
  [data-theme="dark"] .nota-ayuda-details summary{color:rgba(255,255,255,.5);}
  .preview-cuota{background:#EEF1F6;color:#1B2A4A;}
  .row-card .name{font-size:14px;font-weight:600;margin:0;}
  .row-card .sub{font-size:12px;color:#8a8680;margin:2px 0 0;}
  .badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap;}
  .b-activo{background:#EAF3DE;color:#3B6D11;}
  .b-pagado{background:#E1F5EE;color:#0F6E56;}
  .b-vencido{background:#FCEBEB;color:#A32D2D;}
  .b-refinanciado{background:#EAF0FB;color:#2255A0;}
  .b-porcobrar{background:#FBF3E4;color:#8A6416;}
  input,select,textarea{width:100%;border:1px solid #d8d3c8;border-radius:10px;padding:9px 11px;font-size:15px;background:#fff;}
  #claveInicio:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,151,62,.35);}
  @keyframes jrLogoIn{0%{opacity:0;transform:scale(.7) translateY(10px);}60%{opacity:1;transform:scale(1.05) translateY(0);}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes jrFadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes jrRingPulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.9;transform:scale(1.06);}}
  .jr-splash-tag{animation:jrFadeUp .5s ease both;}
  .jr-splash-ring{animation:jrRingPulse 2.6s ease-in-out infinite;}
  .jr-splash-logo{animation:jrLogoIn .7s cubic-bezier(.34,1.56,.64,1) both;}
  .jr-splash-title{animation:jrFadeUp .6s ease both .25s;}
  .jr-splash-sub{animation:jrFadeUp .6s ease both .4s;}
  .input-clave-bloqueo::placeholder{color:rgba(255,255,255,.45);}
  .input-clave-bloqueo:focus{outline:none;border-color:#C9973E!important;box-shadow:0 0 0 3px rgba(201,151,62,.25);}
  textarea{font-family:inherit;resize:vertical;}
  label{display:block;margin-bottom:12px;}
  label span{display:block;font-size:13px;color:#666;margin-bottom:4px;}
  .btn{border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-outline{background:#fff;border:1px solid #d8d3c8;color:#333;}
  .btn-danger{background:#fff;border:1px solid #f3c9c9;color:#c0433b;}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid #e5e1d8;display:flex;justify-content:space-around;padding:8px 0;}
  .tab-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gold);cursor:pointer;padding:4px 10px;}
  .tab-btn.active{color:var(--navy);font-weight:600;}
  .tab-btn svg{width:21px;height:21px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{background:#F5F3EE;text-align:left;padding:8px 6px;}
  td{padding:6px;border-top:1px solid #eee;}
  .empty{text-align:center;color:#b3af a6;color:#aba692;font-size:13px;padding:24px 0;}
  .searchbar{display:flex;align-items:center;gap:8px;border:1px solid #d8d3c8;border-radius:10px;padding:8px 12px;flex:1;background:#fff;}
  .searchbar input{border:none;padding:0;flex:1;}
  .toprow{display:flex;gap:8px;margin-bottom:16px;}
  .iconbtn{background:var(--navy);color:#fff;border:none;border-radius:12px;width:48px;height:48px;font-size:24px;line-height:1;flex-shrink:0;}
  .flexrow{display:flex;gap:8px;}
  .hint{font-size:12px;color:#aaa;margin-top:6px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:#EEF1F6;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  .flex-gap{display:flex;align-items:center;gap:10px;}
  .backbtn{background:none;border:none;color:#fff;font-size:20px;margin-right:6px;cursor:pointer;}
  .cartera-grupo{font-size:12px;font-weight:700;color:#A32D2D;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
  .printbtn{background:none;border:none;color:#9c9890;font-size:16px;cursor:pointer;padding:4px;}
  #recibo-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px;}
  #recibo-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  #recibo-imprimible .rline{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #eee;}
  #recibo-imprimible .rtotal{font-size:17px;font-weight:700;color:var(--navy);}
  .marca-agua{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:64px;font-weight:800;color:var(--navy);opacity:0.06;pointer-events:none;white-space:nowrap;z-index:0;}
  #recibo-imprimible > *:not(.marca-agua){position:relative;z-index:1;}
  #reporte-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px;}
  #reporte-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  #tabla-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px 10px;}
  #tabla-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  .tabla-card{border:1px solid #e5e1d8;border-radius:16px;overflow:hidden;margin-bottom:16px;}
  .fila-amort{border-top:1px solid #f0ede6;}
  .fila-ajuste{background:#F3F8EE;}
  .fila-total-amort{border-top:2px solid #d8d3c8;background:#F5F3EE;}
  .fila-header-desplegable{background:#F5F3EE;}
  [data-theme="dark"] .fila-header-desplegable{background:#20283A;}
  summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:revert;}
  #reporte-imprimible details[open] summary{border-bottom:1px solid #e5e1d8;}
  [data-theme="dark"] #reporte-imprimible details[open] summary{border-bottom-color:rgba(255,255,255,.08);}
  .tabla-card details[open] summary{border-bottom:1px solid #e5e1d8;}
  [data-theme="dark"] .tabla-card details[open] summary{border-bottom-color:rgba(255,255,255,.08);}
  .solo-imprimir{display:none;}
  @page{ size: A4; margin: 14mm; }
  @page recibo{ size: 80mm 170mm; margin: 6mm; }
  @media print{
    #app{ max-width:none!important; margin:0!important; padding:0!important; background:#fff!important; min-height:0!important; }
    .content{ padding:0!important; }
    body *{visibility:hidden;}
    #recibo-imprimible, #recibo-imprimible *,
    #reporte-imprimible, #reporte-imprimible *,
    #tabla-imprimible, #tabla-imprimible *{visibility:visible;}
    #recibo-imprimible, #reporte-imprimible, #tabla-imprimible{position:absolute;top:0;left:0;width:100%;border:none;margin:0!important;}
    #tabla-imprimible{padding:10px!important;}
    #recibo-imprimible{ page: recibo; position:absolute!important; left:0!important; right:0!important; width:100%!important; max-width:300px!important; margin:0 auto!important; }
    #tabla-imprimible table{min-width:0!important;width:100%!important;font-size:9px!important;}
    #tabla-imprimible th, #tabla-imprimible td{padding:4px 5px!important;}
    #reporte-imprimible table{width:100%!important;font-size:9px!important;}
    #reporte-imprimible th, #reporte-imprimible td{padding:4px 5px!important;}
    .tabla-card{border:none!important;border-radius:0!important;}
    #recibo-imprimible{padding:0!important;}
    #recibo-imprimible h2{font-size:14px!important;text-align:center;}
    #recibo-imprimible .rline{font-size:9.5px!important;padding:3px 0!important;}
    #recibo-imprimible .rtotal{font-size:12px!important;}
    #reporte-imprimible{padding:10px!important;}
    #reporte-imprimible h2{font-size:14px!important;}
    .solo-imprimir{display:block;}
    /* Al imprimir siempre en blanco y negro sobre papel, sin importar si estaba en modo
       oscuro — el papel no tiene "modo oscuro". */
    #recibo-imprimible, #reporte-imprimible, #tabla-imprimible{background:#fff!important;color:#222!important;}
    #recibo-imprimible th{background:#F5F3EE!important;}
    #reporte-imprimible th, #tabla-imprimible th{background:#1B2A4A!important;color:#fff!important;}
    .fila-amort{border-top-color:#f0ede6!important;}

  .jr-modal-overlay{position:fixed;inset:0;background:rgba(20,20,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999;animation:jrFadeIn .15s ease-out;}
  @keyframes jrFadeIn{from{opacity:0}to{opacity:1}}
  .jr-modal-card{background:#fff;border-radius:18px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);}

  /* ===== Modo oscuro =====

<body>
<div id="app"></div>
<div id="jr-modal-root"></div>

<script>
const NAVY = "#1B2A4A", GOLD = "#C9973E";
// Nombre/siglas fijas de la marca de la app, usadas SOLO en la pantalla de acceso (login).
// A propósito NO usan nombreApp()/siglasApp() (que sí cambian con "Nombre del negocio" en
// Ajustes) — el login es la carta de presentación de la app y debe quedar siempre igual,
// aunque distintos negocios usen copias de este archivo con otro nombre en sus recibos.
const NOMBRE_MARCA = "JR Prestamito", SIGLAS_MARCA = "JR";

// ── Ventanas propias (reemplazan alert()/confirm() nativos) ──────────────────
// Los cuadros nativos del navegador siempre muestran el dominio del sitio
// ("jr-prestamito.github.io dice...") — es una medida de seguridad del navegador,
// no algo que el sitio pueda quitar. Esta es la alternativa: una ventana con el
// diseño de la app, sin mencionar ningún dominio. Como no es bloqueante como el
// alert()/confirm() nativo, recibe una función de respuesta (callback) en vez de
// devolver el valor directamente.
let _jrModalOnOk = null, _jrModalOnCancel = null;
function jrEscapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function jrCerrarModal(){
  const root = document.getElementById("jr-modal-root");
  if(root) root.innerHTML = "";
  _jrModalOnOk = null; _jrModalOnCancel = null;
}
function jrModalOk(){
  // Importante: hay que leer el valor del campo de texto ANTES de borrar la ventana modal,
  // porque borrarla (jrCerrarModal) elimina el <input> del DOM. Si se lee después, siempre
  // llega vacío — este era un bug real que afectaba a toda función que usa mostrarPrompt
  // (poner clave manual, confirmar clave, generar clave de sincronización, etc.).
  const inputEl = document.getElementById("jr-modal-input");
  const valorCapturado = inputEl ? inputEl.value : undefined;
  const cb = _jrModalOnOk;
  jrCerrarModal();
  if(cb) cb(valorCapturado);
}
function jrModalCancel(){
  const cb = _jrModalOnCancel;
  jrCerrarModal();
  if(cb) cb();
}
function mostrarAlerta(mensaje, cb){
  _jrModalOnOk = cb || null;
  _jrModalOnCancel = null;
  const root = document.getElementById("jr-modal-root");
  if(!root){ if(cb) cb(); return; }
  root.innerHTML = `
    <div class="jr-modal-overlay">
      <div class="jr-modal-card">
        <p class="jr-modal-msg">${jrEscapeHtml(mensaje)}</p>
        <button class="btn btn-gold" style="width:100%;" onclick="jrModalOk()">Entendido</button>
      </div>
    </div>`;
  const btn = root.querySelector("button");
  if(btn) btn.focus();
}
function mostrarConfirmacion(mensaje, cb, opciones){
  opciones = opciones || {};
  _jrModalOnOk = function(){ if(cb) cb(true); };
  _jrModalOnCancel = function(){ if(cb) cb(false); };
  const root = document.getElementById("jr-modal-root");
  if(!root){ if(cb) cb(false); return; }
  const textoAceptar = opciones.textoAceptar || "Aceptar";
  const textoCancelar = opciones.textoCancelar || "Cancelar";
  const peligro = !!opciones.peligro;
  root.innerHTML = `
    <div class="jr-modal-overlay">
      <div class="jr-modal-card">
        <p class="jr-modal-msg">${jrEscapeHtml(mensaje)}</p>
        <div class="flexrow">
          <button class="btn btn-outline" onclick="jrModalCancel()">${jrEscapeHtml(textoCancelar)}</button>
          <button class="${peligro?"btn btn-danger":"btn btn-gold"}" onclick="jrModalOk()">${jrEscapeHtml(textoAceptar)}</button>
        </div>
      </div>
    </div>`;
}
function mostrarPrompt(mensaje, cb, opciones){
  opciones = opciones || {};
  const root = document.getElementById("jr-modal-root");
  if(!root){ if(cb) cb(null); return; }
  _jrModalOnOk = function(valorCapturado){
    if(cb) cb(valorCapturado!==undefined ? valorCapturado : "");
  };
  _jrModalOnCancel = function(){ if(cb) cb(null); };
  root.innerHTML = `
    <div class="jr-modal-overlay">
      <div class="jr-modal-card">
        <p class="jr-modal-msg">${jrEscapeHtml(mensaje)}</p>
        <input id="jr-modal-input" type="${opciones.tipo||"text"}" value="${jrEscapeHtml(opciones.valorInicial||"")}" style="width:100%;padding:10px;border-radius:10px;border:1px solid #d8d3c8;margin-bottom:14px;font-size:15px;box-sizing:border-box;" onkeydown="if(event.key==='Enter'){ event.preventDefault(); jrModalOk(); }">
        <div class="flexrow">
          <button class="btn btn-outline" onclick="jrModalCancel()">${jrEscapeHtml(opciones.textoCancelar||"Cancelar")}</button>
          <button class="btn btn-gold" onclick="jrModalOk()">${jrEscapeHtml(opciones.textoAceptar||"Aceptar")}</button>
        </div>
      </div>
    </div>`;
  setTimeout(function(){ const el=document.getElementById("jr-modal-input"); if(el) el.focus(); }, 30);
}
// Pide la confirmación normal (con su mensaje/botones de siempre) y, si la app tiene una
// clave configurada, agrega un segundo paso pidiendo esa clave antes de ejecutar la acción
// — pensado para acciones destructivas (eliminar préstamo, pago o cliente) que conviene
// proteger un poco más, sin mandar al usuario a la pantalla de login completa: es un
// candado rápido dentro de la misma pantalla donde está trabajando.
function confirmarConClave(mensaje, cb, opciones){
  mostrarConfirmacion(mensaje, function(ok){
    if(!ok){ if(cb) cb(false); return; }
    if(!state.config.pin){ if(cb) cb(true); return; }
    mostrarPrompt("Para confirmar, escribe tu clave de la app:", function(valor){
      if(valor === null){ if(cb) cb(false); return; }
      if(valor === state.config.pin){ if(cb) cb(true); }
      else{ mostrarAlerta("Clave incorrecta. No se realizó la acción."); if(cb) cb(false); }
    }, { tipo:"password", textoAceptar:"Confirmar" });
  }, opciones);
}
const METODOS = ["Francés (cuota fija)","Alemán (cuota decreciente)","Tasa plana (interés fijo)","Capital al final (bullet)","Sistema Americano (puro)","Indefinido (solo interés)"];
const PERIODOS = ["Semanal","Quincenal","Mensual"];
const DIAS_PERIODO = { Semanal:7, Quincenal:15, Mensual:30 };

// Cada instalación guarda sus datos por separado según la RUTA donde vive (no solo el
// dominio). Esto es clave si alojas dos negocios distintos bajo el mismo dominio, por
// ejemplo tuusuario.github.io/negocio1/ y tuusuario.github.io/negocio2/ — sin esto, el
// navegador los trataría como un solo "cajón" de datos compartido y uno pisaría al otro.
const JR_NS = (function(){
  try{ return location.pathname.replace(/\/+$/,"") || "/"; }catch(e){ return "/"; }
})();
function jrKey(base){ return base + "::" + JR_NS; }
(function jrMigrarClavesViejas(){
  // Migración de una sola vez: si esta ruta todavía no tiene datos propios pero existen
  // datos guardados con el nombre viejo (de antes de separar por ruta), los copia una
  // vez para que nadie pierda lo que ya tenía cargado.
  try{
    ["jr_clientes","jr_prestamos","jr_config"].forEach(function(base){
      const claveNueva = jrKey(base);
      if(localStorage.getItem(claveNueva) === null){
        const viejo = localStorage.getItem(base);
        if(viejo !== null) localStorage.setItem(claveNueva, viejo);
      }
    });
  }catch(e){}
})();

// Si el navegador recarga la página (por ejemplo, el gesto de "deslizar para recargar" se
// disparó a pesar del overscroll-behavior, o el usuario le dio refrescar), esto recuerda en
// qué pantalla estaba para devolverlo ahí en vez de mandarlo siempre al inicio. Se guarda en
// sessionStorage (no localStorage) para que solo dure mientras la pestaña siga abierta, no
// entre sesiones distintas de verdad.
function navGuardada(){
  try{
    const raw = sessionStorage.getItem(jrKey("jr_nav"));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
const _navPrevia = navGuardada();
// Los formularios de "nuevo préstamo" y "refinanciar" guardan lo que se va escribiendo en
// window._nf / window._rf (fuera de "state" a propósito). Si solo restauramos state.vista
// pero no esto, una recarga a mitad de esos formularios los deja apuntando a "undefined" y
// la pantalla se rompe (por eso antes, al deslizar, terminaba sacando de donde estaba).
window._nf = (_navPrevia && _navPrevia._nf) || null;
window._rf = (_navPrevia && _navPrevia._rf) || null;

let state = {
  tab: (_navPrevia && _navPrevia.tab) || "inicio",
  clientes: JSON.parse(localStorage.getItem(jrKey("jr_clientes")) || "[]"),
  prestamos: JSON.parse(localStorage.getItem(jrKey("jr_prestamos")) || "[]"),
  config: JSON.parse(localStorage.getItem(jrKey("jr_config")) || '{"tasaMoraDiaria":0}'),
  vista: (_navPrevia && _navPrevia.vista) || "lista",
  seleccionId: (_navPrevia && _navPrevia.seleccionId) || null,
  showFormCliente: (_navPrevia && _navPrevia.showFormCliente) || false,
  clienteEditId: (_navPrevia && _navPrevia.clienteEditId) || null,
  q: "",
  qPrestamos: ""
};
// Se aplica el tema antes del primer render para que no haya un parpadeo de tema claro
// al abrir la app si el modo oscuro está activado.
document.documentElement.setAttribute("data-theme", state.config.temaOscuro ? "dark" : "light");
function guardarNav(){
  try{
    sessionStorage.setItem(jrKey("jr_nav"), JSON.stringify({
      tab: state.tab, vista: state.vista, seleccionId: state.seleccionId,
      showFormCliente: state.showFormCliente, clienteEditId: state.clienteEditId,
      _nf: window._nf || null, _rf: window._rf || null
    }));
  }catch(e){}
}

let _autoSyncTimer = null;
function save(opts){
  localStorage.setItem(jrKey("jr_clientes"), JSON.stringify(state.clientes));
  localStorage.setItem(jrKey("jr_prestamos"), JSON.stringify(state.prestamos));
  localStorage.setItem(jrKey("jr_config"), JSON.stringify(state.config));
  const sinAutoSync = opts && opts.sinAutoSync;
  if(!sinAutoSync && state.config.syncUrl && state.config.syncKey && state.config.autoSync !== false){
    // "Al instante" con un pequeñísimo margen (600ms) en vez de 0ms: si no se agrupan los
    // cambios, escribir un nombre letra por letra dispararía una subida a la nube por cada
    // tecla presionada. Este margen agrupa esas teclas en una sola subida, pero sigue
    // sintiéndose instantáneo (antes eran 2 segundos completos de espera).
    clearTimeout(_autoSyncTimer);
    _autoSyncTimer = setTimeout(()=>{ subirNube(true); }, 600);
  }
}
// Al abrir la app (una sola vez por sesión), si hay nube configurada, trae automáticamente
// lo último guardado ahí — así si se editó desde otro celular, este se pone al día solo,
// sin tener que entrar a Ajustes y darle "Descargar" a mano. Es silencioso: si no hay
// internet o falla, sigue de largo con los datos que ya había en este celular.
let _autoCargaNubeHecha = false;
async function autoCargarNubeAlAbrir(){
  if(_autoCargaNubeHecha) return;
  _autoCargaNubeHecha = true;
  const url = (state.config.syncUrl||"").trim();
  const key = (state.config.syncKey||"").trim();
  if(!url || !key) return;
  if(state.syncBusy) return;
  try{
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "action=pull&key=" + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok && data.datos){
      state.clientes = data.datos.clientes || state.clientes;
      state.prestamos = data.datos.prestamos || state.prestamos;
      if(data.datos.config && data.datos.config.tasaMoraDiaria!==undefined){
        state.config.tasaMoraDiaria = data.datos.config.tasaMoraDiaria;
      }
      state.config.ultimaDescarga = new Date().toISOString();
      save({sinAutoSync:true});
      render();
    }
  }catch(e){ /* sin internet o la nube no respondió: seguimos con los datos locales, sin molestar con una alerta */ }
}
// --- Contabilidad de refinanciamientos según NIF C-19 (equivalente a NIIF 9) ---
// Cuando se modifican las condiciones de un préstamo (tasa, plazo, capital), la norma
// exige comparar el valor presente de los flujos de efectivo NUEVOS (descontados a la
// tasa efectiva ORIGINAL) contra el capital que queda como base del préstamo justo antes
// de la modificación (el saldo pendiente, ya restando el enganche/abono y sumando el
// monto adicional entregado en la misma operación — la app lo calcula como "nuevoCapital").
// Importante: el enganche y el monto adicional NO son ganancia ni pérdida por sí mismos —
// son simplemente efectivo que entra o sale, y por eso se restan/suman ANTES de comparar.
// Si la diferencia es de 10% o más, es una "modificación sustancial": se da de baja el
// préstamo anterior y se reconoce uno nuevo. Si es menor al 10%, es una modificación NO
// sustancial: se ajustan las condiciones del mismo préstamo y la diferencia de valor
// presente (que ya viene neta del enganche/adicional) se reconoce como ganancia o pérdida.
function valorPresente(flujos, tasaPeriodica){
  return flujos.reduce((pv, monto, i) => pv + (Number(monto)||0) / Math.pow(1+tasaPeriodica, i+1), 0);
}
// Tasa Interna de Retorno (TIR) periódica: la tasa que hace que el valor presente de
// "flujos" sea exactamente "capitalInicial". En Francés, Alemán y Capital al final el
// interés se calcula sobre saldos que decrecen de forma compuesta, así que esta TIR sale
// idéntica a la tasa nominal del préstamo. Pero en "Tasa plana" (interés fijo, no decrece
// con el saldo) y "Sistema Americano" (interés simple, no compuesto) la tasa nominal NO es
// la tasa efectiva real — y usar la nominal para descontar distorsiona la prueba del 10%.
// Por eso siempre se calcula la TIR real aquí (por bisección, ya que no hay fórmula
// cerrada general) y esa es la que se usa como "tasa efectiva original".
function calcularTIR(flujos, capitalInicial){
  if(!flujos.length || !(capitalInicial>0)) return null;
  const f = (r) => valorPresente(flujos, r) - capitalInicial;
  if(f(0) < 0) return null; // ni siquiera sin descuento los flujos alcanzan el capital: no hay TIR válida
  let lo = 0, hi = 10, hiVal = f(hi), intentos = 0;
  while(hiVal > 0 && intentos < 20){ hi *= 2; hiVal = f(hi); intentos++; }
  if(hiVal > 0) return null;
  for(let i=0;i<100;i++){
    const mid = (lo+hi)/2, val = f(mid);
    if(Math.abs(val) < 1e-9) return mid;
    if(val > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}
function evaluarModificacionNIF(origen, capitalBase, flujosNuevos, opts){
  opts = opts || {};
  if(!(Number(capitalBase)>0)){
    // Sin una base confiable contra la cual comparar (p. ej. el capital neto quedó en 0):
    // por prudencia se trata como modificación sustancial, igual que el comportamiento de siempre.
    return { esSustancial:true, diffPct:null, pvOriginal:0, pvNuevo:0, gananciaPerdida:0 };
  }
  const tasaNominalOriginal = (Number(origen.tasa)||0)/100;
  let tasaEfectivaOriginal = tasaNominalOriginal;
  // El método Indefinido no tiene un número de cuotas que amortice el capital a cero, así
  // que no se le puede calcular una TIR (no hay tabla que "cierre" en capital); ahí se usa
  // la tasa nominal directamente, tal como ya se hace en toda la app para ese método.
  if(origen.metodo !== METODOS[5]){
    const capitalOrigenActual = Number(origen.capital)||0;
    const tablaOrigenActual = generarTabla({capital:capitalOrigenActual, tasa:origen.tasa, cuotas:origen.cuotas, periodo:origen.periodo, metodo:origen.metodo, fechaInicio:origen.fechaInicio});
    const tir = calcularTIR(tablaOrigenActual.map(f=>f.cuota), capitalOrigenActual);
    if(tir!==null) tasaEfectivaOriginal = tir;
  }
  let pvNuevo;
  if(opts.esIndefinidoNuevo){
    // El método Indefinido paga solo interés, para siempre, sin plazo fijo: es una
    // "perpetuidad". El valor presente de una perpetuidad es pago/tasa — usar en vez la
    // suma de una tabla truncada a 6 filas (que es solo una ayuda visual/de vencimientos,
    // no el flujo económico real) subestimaría muchísimo su valor y dispararía falsos
    // positivos de "modificación sustancial" aunque nada haya cambiado en realidad.
    const cuotaPeriodica = Number(flujosNuevos[0])||0;
    pvNuevo = tasaEfectivaOriginal>0 ? cuotaPeriodica/tasaEfectivaOriginal : cuotaPeriodica;
  } else {
    pvNuevo = valorPresente(flujosNuevos, tasaEfectivaOriginal);
  }
  const diffPct = Math.abs(pvNuevo-capitalBase)/capitalBase;
  const umbral = (Number(state.config.umbralModificacionSustancial)||10)/100;
  const esSustancial = diffPct >= umbral;
  const gananciaPerdida = esSustancial ? 0 : (pvNuevo - capitalBase);
  return { esSustancial, diffPct, pvOriginal: capitalBase, pvNuevo, gananciaPerdida, tasaEfectivaOriginal };
}
// Nombre del negocio: se puede editar en Ajustes para "vestir" la app con otro nombre
// (por ejemplo, para dársela a otro prestamista con su propio negocio). Si no se ha
// configurado nada, se usa "JR Prestamito" como antes.
function nombreApp(){ return (state.config.nombreNegocio || "JR Prestamito").trim() || "JR Prestamito"; }
function siglasApp(){
  // Quita puntos, guiones y otros símbolos antes de sacar las iniciales, para que
  // un nombre como "J.R" o "J.R. Préstamos" dé "JR" y no "J." por el punto.
  const limpio = nombreApp().replace(/[^\p{L}\p{N}\s]/gu, "").trim();
  const partes = limpio.split(/\s+/).filter(Boolean);
  if(partes.length===0) return "JR";
  // Si la primera palabra ya es una sigla (2 a 4 letras mayúsculas, ej. "JR"), se usa tal cual
  // en vez de combinarla con la inicial de la siguiente palabra (evita "JR Prestamito" -> "JP").
  if(/^[A-ZÁÉÍÓÚÑ]{2,4}$/.test(partes[0])) return partes[0];
  if(partes.length>=2) return (partes[0][0]+partes[1][0]).toUpperCase();
  return partes[0].slice(0,2).toUpperCase();
}
// Genera una clave segura al azar (sin caracteres ambiguos como 0/O o 1/l/I) para que
// el negocio nunca tenga que inventarse ni escribir sus propias claves de protección.
function generarClaveSegura(longitud){
  longitud = longitud || 10;
  const alfabeto = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let clave = "";
  if(window.crypto && window.crypto.getRandomValues){
    const arr = new Uint32Array(longitud);
    window.crypto.getRandomValues(arr);
    for(let i=0;i<longitud;i++) clave += alfabeto[arr[i] % alfabeto.length];
  } else {
    for(let i=0;i<longitud;i++) clave += alfabeto[Math.floor(Math.random()*alfabeto.length)];
  }
  return clave;
}
// Sal aleatoria de 16 bytes para acompañar cada clave que se hashea (evita que dos
// archivos con la misma clave por casualidad terminen con el mismo hash guardado).
function generarSal(){
  const arr = new Uint8Array(16);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
  else for(let i=0;i<arr.length;i++) arr[i] = Math.floor(Math.random()*256);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Hash de un solo sentido (SHA-256) para la clave del archivo protegido. A diferencia
// de Base64 (que cualquiera, incluida una IA, "decodifica" al instante), un hash NO se
// puede revertir a la clave original: solo sirve para comparar, nunca para recuperarla.
async function hashConSal(texto){
  const datos = new TextEncoder().encode(texto);
  const buf = await window.crypto.subtle.digest("SHA-256", datos);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function soloDigitos(s){ return (s||"").toString().replace(/\D/g,""); }
// Los campos de dinero/tasa usan type="text" (no "number") a propósito: los inputs numéricos
// no soportan mantener la posición del cursor al reconstruir el DOM, lo que hacía que los
// dígitos parecieran escribirse al revés en el celular. Estas funciones filtran lo que se
// puede escribir sin perder esa posición del cursor.
function filtrarDecimal(v){
  v = (v||"").toString().replace(/[^0-9.]/g, "");
  const partes = v.split(".");
  if(partes.length>2) v = partes[0] + "." + partes.slice(1).join("");
  return v;
}
function filtrarEntero(v){ return (v||"").toString().replace(/[^0-9]/g, ""); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nextCode(prefix, list){
  const nums = list.map(x => parseInt((x.codigo||"").split("-")[1],10)).filter(n=>!isNaN(n));
  const usados = new Set(nums);
  // En vez de siempre tomar "el máximo + 1", se busca el primer número libre de la
  // secuencia empezando en 1. Así, si se elimina un préstamo/cliente (dejando un hueco,
  // p. ej. P-0003), el próximo que se cree ocupa ese mismo número en vez de saltarlo.
  let n = 1;
  while(usados.has(n)) n++;

}
function money(n){
  n = Number(n);
  n = Number.isFinite(n) ? n : 0;

}
function hoyISO(){
  // OJO: usar el día calendario LOCAL, no toISOString() (que da la fecha en UTC).
  // Honduras está en UTC-6, así que desde ~6:00pm hora local, toISOString() ya
  // muestra la fecha del día siguiente, lo cual marcaba cuotas como vencidas un
  // día antes de tiempo. Por eso aquí se arma la fecha con año/mes/día locales.
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("es-HN", {day:"2-digit", month:"short", year:"numeric"});
}
function fmtDateCompacto(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];
  return `${String(d.getDate()).padStart(2,"0")}-${meses[d.getMonth()]}-${d.getFullYear()}`;
}
function diasAtraso(fecha){
  if(!fecha) return 0;
  const hoy = hoyISO();
  const diff = Math.round((new Date(hoy) - new Date(fecha))/86400000);
  return Math.max(0, diff);
}

function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

function generarTabla(p){
  const capital = Number(p.capital)||0, tasa = (Number(p.tasa)||0)/100, n = Number(p.cuotas)||0;
  const dias = DIAS_PERIODO[p.periodo] || 30;
  // Configurable en Ajustes: si se cuenta el día de inicio del préstamo como "día 1" del
  // plazo (resta 1 día a cada fecha de cuota) o si se usa el estándar de la banca formal
  // (no se cuenta, la primera cuota cae exactamente "dias" después del inicio).
  const offsetDia1 = (state.config.contarDiaInicio !== false) ? 1 : 0;
  const filas = [];
  if(p.metodo === METODOS[0]){ // Francés (cuota fija)
    const cuotaFija = n===0 ? 0 : (tasa===0 ? capital/n : (capital*tasa)/(1-Math.pow(1+tasa,-n)));
    const cuotaRed = round2(cuotaFija);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const saldoInicial = saldo;
      const interes = round2(saldo*tasa);
      const abono = (i===n) ? saldo : round2(cuotaRed - interes);
      const cuota = round2(interes + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial, cuota, interes, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[1]){ // Alemán (cuota decreciente): abono fijo, interés sobre saldo
    const abonoFijo = n===0 ? 0 : round2(capital/n);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const saldoInicial = saldo;
      const interes = round2(saldo*tasa);
      const abono = (i===n) ? saldo : abonoFijo;
      const cuota = round2(interes + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial, cuota, interes, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[2]){ // Tasa plana (interés fijo): interés siempre sobre el capital original
    const interesFijo = round2(capital*tasa);
    const abonoFijo = n===0 ? 0 : round2(capital/n);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const saldoInicial = saldo;
      const abono = (i===n) ? saldo : abonoFijo;
      const cuota = round2(interesFijo + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial, cuota, interes:interesFijo, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[3]){ // Capital al final (bullet): solo interés cada período, capital al final
    const interesFijo = round2(capital*tasa);
    for(let i=1;i<=n;i++){
      const esUltima = i===n, abono = esUltima?capital:0;
      const cuota = round2(interesFijo + abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial:capital, cuota, interes:interesFijo, abono, saldo: esUltima?0:capital});
    }
  } else if(p.metodo === METODOS[4]){ // Sistema Americano (puro): nada hasta el final, ahí capital + todo el interés junto
    for(let i=1;i<=n;i++){
      const esUltima = i===n;
      const interes = esUltima ? round2(capital*tasa*n) : 0;
      const abono = esUltima ? capital : 0;
      const cuota = round2(interes + abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial:capital, cuota, interes, abono, saldo: esUltima?0:capital});
    }
  } else if(p.metodo === METODOS[5]){ // Indefinido (solo interés)
    const interesFijo = round2(capital*tasa);
    const hechas = (p.pagos||[]).length, total = Math.max(hechas+4,6);
    for(let i=1;i<=total;i++){
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial:capital, cuota:interesFijo, interes:interesFijo, abono:0, saldo:capital});
    }
  }
  return filas;
}
// --- Motor dinámico de abono a capital ---
// generarTabla() de arriba genera la tabla "de fábrica" del préstamo (como si se pagara
// exactamente a tiempo, sin abonos). Cuando el cliente hace un abono a capital, en vez de
// solo sumar ese dinero al acumulado y "tachar" cuotas futuras de esa tabla original (lo
// cual cobra de más porque usa montos de interés que ya no corresponden al saldo real),
// esta función reconstruye la tabla tomando en cuenta el saldo REAL en el momento de cada
// abono (guardado en p.ajustesCapital, cada uno como {despuesDeFila, monto, fecha}) y
// aplica la regla de negocio según el método:
//   - Francés / Tasa plana: la cuota (o el abono fijo, en tasa plana) NO cambia; se
//     recalculan cuántas cuotas hacen falta para terminar de pagar el saldo nuevo. Así el
//     préstamo se acorta.
//   - Alemán: se mantienen las mismas cuotas restantes (misma fecha final) y se recalcula
//     el abono fijo dividiendo el saldo nuevo entre esas cuotas restantes. Así la cuota
//     baja, sin importar qué tan grande sea el abono (esto corrige el caso límite donde un
//     abono grande acortaba el plazo en vez de solo bajar la cuota).
//   - Capital al final / Indefinido: mismo plazo, el interés periódico se recalcula sobre
//     el saldo nuevo (baja de inmediato).
//   - Sistema Americano (puro): no hay cuotas periódicas; el abono reduce el saldo desde
//     esa fecha en adelante, así que el interés simple acumulado y el pago único final bajan.
// Si un préstamo no tiene ajustes (p.ajustesCapital vacío o ausente) esta función produce
// exactamente la misma tabla que generarTabla(), así que es segura para préstamos viejos.
function generarTablaDinamica(p){
  const capitalOriginal = Number(p.capital)||0;
  const tasa = (Number(p.tasa)||0)/100;
  const dias = DIAS_PERIODO[p.periodo] || 30;
  const offsetDia1 = (state.config.contarDiaInicio !== false) ? 1 : 0;
  const metodo = p.metodo;
  const esIndef = metodo === METODOS[5];
  const nOriginal = Number(p.cuotas)||0;
  const ajustes = (p.ajustesCapital||[]).slice().sort((a,b)=>a.despuesDeFila-b.despuesDeFila);

  if(metodo === METODOS[4] && ajustes.length){
    // Sistema Americano (puro): nada se paga hasta el final; cada abono recalcula el
    // interés simple pendiente sobre el saldo vigente desde ese punto en adelante.
    let saldoSeg = capitalOriginal, desdeFila = 0, interesAcum = 0;
    for(const aj of ajustes){
      interesAcum += saldoSeg*tasa*(aj.despuesDeFila-desdeFila);
      saldoSeg = round2(Math.max(0, saldoSeg-(Number(aj.monto)||0)));
      desdeFila = aj.despuesDeFila;
    }
    const filas = [];
    for(let i=1;i<=nOriginal;i++){
      const esUltima = i===nOriginal;
      const interes = esUltima ? round2(interesAcum + saldoSeg*tasa*(nOriginal-desdeFila)) : 0;
      const abono = esUltima ? saldoSeg : 0;
      const cuota = round2(interes+abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial:capitalOriginal, cuota, interes, abono, saldo: esUltima?0:capitalOriginal});
    }
    return filas;
  }
  if(!ajustes.length) return generarTabla(p); // sin abonos registrados: comportamiento idéntico al de siempre

  let saldo = capitalOriginal;
  let nTotalVigente = nOriginal;               // Francés / Tasa plana: puede acortarse
  let cuotaFijaVigente = null;                  // Francés
  let abonoFijoVigente = null;                  // Alemán / Tasa plana
  let interesFijoVigente = null;                // Tasa plana / Capital al final / Indefinido

  if(metodo===METODOS[0]){
    cuotaFijaVigente = nOriginal===0?0:(tasa===0? capitalOriginal/nOriginal : (capitalOriginal*tasa)/(1-Math.pow(1+tasa,-nOriginal)));
  } else if(metodo===METODOS[1]){
    abonoFijoVigente = nOriginal===0?0: capitalOriginal/nOriginal;
  } else if(metodo===METODOS[2]){
    interesFijoVigente = capitalOriginal*tasa;
    abonoFijoVigente = nOriginal===0?0: capitalOriginal/nOriginal;
  } else if(metodo===METODOS[3] || esIndef){
    interesFijoVigente = capitalOriginal*tasa;
  }

  // Recalcula los parámetros vigentes (cuota fija / abono fijo / interés fijo / plazo) a
  // partir del saldo que queda DESPUÉS de una fila que tuvo abono extra — para que las
  // filas siguientes usen el saldo ya reducido. "filaActual" es la fila que se acaba de
  // generar (donde cayó el abono extra), y "saldo" en ese momento ya incluye tanto el
  // abono programado de esa fila como el abono extra sumado en ella.
  function recalcularVigente(filaActual){
    if(metodo===METODOS[0]){
      if(saldo<=0.01){ nTotalVigente = filaActual; }
      else if(tasa===0){
        nTotalVigente = filaActual + Math.max(1, Math.ceil(saldo/cuotaFijaVigente));
      } else {
        const raw = -Math.log(1 - (saldo*tasa)/cuotaFijaVigente) / Math.log(1+tasa);
        nTotalVigente = filaActual + Math.max(1, Math.ceil(raw - 1e-9));
      }
    } else if(metodo===METODOS[1]){
      const nRestante = nTotalVigente - filaActual;
      abonoFijoVigente = nRestante>0 ? round2(saldo/nRestante) : 0;
    } else if(metodo===METODOS[2]){
      nTotalVigente = abonoFijoVigente>0 ? filaActual + Math.max(1, Math.ceil(saldo/abonoFijoVigente - 1e-9)) : filaActual;
    } else if(metodo===METODOS[3] || esIndef){
      interesFijoVigente = round2(saldo*tasa);
    }
  }

  const filas = [];
  // Para Indefinido el tope es "cuántas filas mostrar" (no hay plazo real); para los demás
  // métodos el propio nTotalVigente (que puede cambiar sobre la marcha) marca el tope.
  // El buffer no puede depender solo de cuántos pagos hay: un préstamo indefinido muy
  // atrasado y sin pagos igual necesita filas hasta el día de hoy (+1) para que la fila del
  // período que toca pueda aparecer. Por eso también se calcula cuántos períodos han pasado
  // de verdad según la fecha, y se usa el que sea más grande de los dos.
  const diasTranscurridos = esIndef ? Math.max(0, Math.floor((new Date(hoyISO()+"T00:00:00") - new Date(p.fechaInicio+"T00:00:00")) / 86400000)) : 0;
  const periodosTranscurridos = esIndef && dias>0 ? Math.floor(diasTranscurridos/dias) : 0;
  const totalFilasIndef = esIndef ? Math.max((p.pagos||[]).length + 4, periodosTranscurridos + 4, 6) : 0;
  let idxAj = 0;
  for(let i=1; i<=(esIndef?totalFilasIndef:9999); i++){
    if(!esIndef && i>nTotalVigente) break;
    const saldoInicial = saldo;
    let interes, abonoProgramado;
    if(metodo===METODOS[0]){
      interes = round2(saldo*tasa);
      abonoProgramado = (i===nTotalVigente) ? saldo : round2(cuotaFijaVigente-interes);
    } else if(metodo===METODOS[1]){
      interes = round2(saldo*tasa);
      abonoProgramado = (i===nTotalVigente) ? saldo : abonoFijoVigente;
    } else if(metodo===METODOS[2]){
      abonoProgramado = (i===nTotalVigente) ? saldo : abonoFijoVigente;
      interes = interesFijoVigente;
    } else if(metodo===METODOS[3]){
      const esUltima = i===nTotalVigente;
      abonoProgramado = esUltima ? saldo : 0;
      interes = interesFijoVigente;
    } else { // Indefinido
      interes = interesFijoVigente;
      abonoProgramado = 0;
    }
    // Si en esta fila cayó un abono a capital extra (ajustesCapital), se suma AQUÍ, al
    // abono de esta misma fila — así se ve reflejado donde realmente se pagó, no hasta la
    // fila siguiente. El saldo de esta fila baja de inmediato con ese extra incluido.
    let abono = abonoProgramado;
    let huboAjuste = false;
    while(idxAj<ajustes.length && ajustes[idxAj].despuesDeFila===i){
      abono = round2(Math.min(saldoInicial, abono + (Number(ajustes[idxAj].monto)||0)));
      huboAjuste = true;
      idxAj++;
    }
    const cuota = round2(interes+abono);
    const nuevoSaldo = round2(Math.max(0, saldoInicial-abono));
    filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i - offsetDia1), saldoInicial, cuota, interes, abono, saldo: nuevoSaldo});
    saldo = nuevoSaldo;
    if(huboAjuste) recalcularVigente(i);
  }
  return filas;
}
function resumen(p){
  const tabla = generarTablaDinamica(p);
  const esIndef = p.metodo === METODOS[5];
  const capital = Number(p.capital)||0, tasa=(Number(p.tasa)||0)/100;
  const pagos = p.pagos || [];
  // el capital/interés se acumula por separado de la mora: la mora no hace avanzar cuotas
  const totalPagado = pagos.reduce((s,pg)=> s + (Number(pg.monto)||0), 0);
  const moraTotal = pagos.reduce((s,pg)=> s + (Number(pg.mora)||0), 0);

  if(p.liquidadoAnticipado){
    return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente:0, capitalPendiente:0, estado:"Pagado", proximaFecha:null,
      tabla, pagosHechos: tabla.length, cuotaActual:null, abonadoEnCuotaActual:0, faltaEnCuotaActual:0,
      moraTotal, totalPagado };
  }
  if(p.refinanciado){
    return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente:0, capitalPendiente:0, estado:"Refinanciado", proximaFecha:null,
      tabla, pagosHechos: tabla.length, cuotaActual:null, abonadoEnCuotaActual:0, faltaEnCuotaActual:0,
      moraTotal, totalPagado };
  }

  if(esIndef){
    // Antes se usaba una fórmula fija (capital*tasa) para saber cuántos períodos ya se
    // pagaron. El problema: si hubo un abono a capital, el interés real de los períodos
    // siguientes baja (eso ya lo calcula bien generarTablaDinamica en "tabla"), pero la
    // fórmula fija seguía comparando contra el interés ORIGINAL, más alto — de ahí que el
    // conteo de períodos pagados quedara mal después de un abono. Ahora se compara contra
    // la cuota real de cada fila de "tabla", igual que se hace para los demás métodos.
    let cumI = 0, periodosPagados = 0;
    for(let i=0;i<tabla.length;i++){
      cumI += tabla[i].cuota;
      if(totalPagado+0.01 >= cumI) periodosPagados = i+1; else break;
    }
    const cuotaActualRow = tabla[periodosPagados] || null;
    const baseAnterior = periodosPagados>0 ? tabla.slice(0,periodosPagados).reduce((s,f)=>s+f.cuota,0) : 0;
    const abonadoEnCuotaActual = Math.max(0, totalPagado-baseAnterior);
    const capitalPendienteIndef = periodosPagados>0 ? (tabla[periodosPagados-1].saldo||capital) : capital;
    return { cuota: cuotaActualRow ? cuotaActualRow.cuota : (tabla[tabla.length-1]?tabla[tabla.length-1].cuota:0),
      saldoPendiente: capitalPendienteIndef, capitalPendiente: capitalPendienteIndef, estado:"Activo",
      proximaFecha: cuotaActualRow ? cuotaActualRow.fecha : null, tabla,
      pagosHechos: periodosPagados, cuotaActual: cuotaActualRow,
      abonadoEnCuotaActual, faltaEnCuotaActual: cuotaActualRow ? Math.max(0, cuotaActualRow.cuota-abonadoEnCuotaActual) : 0,
      moraTotal, totalPagado };
  }

  // acumulado de cuotas: una cuota se marca "completa" cuando lo pagado alcanza su acumulado,
  // así un abono menor a la cuota queda como abono parcial y uno mayor adelanta la siguiente
  let cum = 0, cuotasCompletas = 0;
  const acumulados = tabla.map(f=>{ cum += f.cuota; return cum; });
  for(let i=0;i<acumulados.length;i++){
    if(totalPagado + 0.01 >= acumulados[i]) cuotasCompletas = i+1; else break;
  }
  const totalCuotas = tabla.length;
  const pagado = cuotasCompletas >= totalCuotas && totalCuotas>0;
  const cuotaActual = tabla[cuotasCompletas] || null;
  const baseAnterior = cuotasCompletas>0 ? acumulados[cuotasCompletas-1] : 0;
  const abonadoEnCuotaActual = cuotaActual ? Math.max(0, totalPagado - baseAnterior) : 0;
  const faltaEnCuotaActual = cuotaActual ? Math.max(0, cuotaActual.cuota - abonadoEnCuotaActual) : 0;
  const saldoPendiente = Math.max(0, (acumulados[totalCuotas-1]||0) - totalPagado);
  // capital realmente pendiente (sin contar el interés de las cuotas que faltan), util para refinanciar
  const capitalPendiente = pagado ? 0 : (cuotasCompletas>0 ? Math.max(0, tabla[cuotasCompletas-1].saldo||0) : capital);

  return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente, capitalPendiente, estado: pagado?"Pagado":"Activo",
    proximaFecha: pagado?null:(cuotaActual?cuotaActual.fecha:null), tabla, pagosHechos: cuotasCompletas,
    cuotaActual, abonadoEnCuotaActual, faltaEnCuotaActual, moraTotal, totalPagado };
}

window.__huellaSoportada = false;

function arrayBufferABase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64AUint8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function activarHuella(){
  if(!(window.PublicKeyCredential && window.__huellaSoportada)){
    mostrarAlerta("La huella / Face ID no está disponible en este navegador o en este formato de archivo. Para poder usarla, la app necesita abrirse desde una dirección https:// (no como archivo local descargado).");
    return;
  }
  if(!state.config.pin){
    mostrarAlerta("Primero pon una clave de inicio. La huella se usa como atajo para no escribirla, pero la clave sigue siendo el respaldo.");
    return;
  }
  try{
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: challenge,
        rp: { name: nombreApp() },
        user: { id: userId, name: "principal", displayName: nombreApp() },
        pubKeyCredParams: [{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
        authenticatorSelection: { authenticatorAttachment:"platform", userVerification:"required" },
        timeout: 60000,
        attestation: "none"
      }
    });
    if(!cred) throw new Error("sin credencial");
    state.config.huellaCredId = arrayBufferABase64(cred.rawId);
    save(); render();
    mostrarAlerta("Listo. Ya puedes desbloquear con tu huella o Face ID — la clave sigue funcionando también, por si acaso.");
  }catch(err){
    mostrarAlerta("No se pudo activar. Puede que este celular no tenga huella o Face ID configurados, o que se haya cancelado el permiso.");
  }
}
function desactivarHuella(){

async function usarHuella(){
  if(!(window.PublicKeyCredential && state.config.huellaCredId)) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const credId = base64AUint8(state.config.huellaCredId);
    const resultado = await navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        allowCredentials: [{ id: credId, type:"public-key", transports:["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    });
    if(resultado){
      desbloqueado = true;
      sessionStorage.setItem(jrKey("jr_desbloqueado"), "1");
      state._errorClave = false;
      render();
    }
  }catch(err){
    // Canceló o falló la verificación — se queda en la pantalla de clave normal, sin drama.
  }
}

  html += `</div>` + viewTabbar();

  // El panel de "Ajustes protegidos" debe verse centrado en el espacio que queda entre el
  // encabezado y la barra inferior. En vez de adivinar esas alturas (que cambian según el
  // celular, el notch, etc.), se miden de verdad ya insertado en la pantalla.
  const panelClave = document.getElementById("panelAjustesClave");
  if(panelClave){
    const headerEl = document.querySelector("#app > header");
    const tabbarEl = document.querySelector("#app > .tabbar");
    const altoHeader = headerEl ? headerEl.offsetHeight : 0;
    const altoTabbar = tabbarEl ? tabbarEl.offsetHeight : 0;
    panelClave.style.minHeight = `calc(100vh - ${altoHeader + altoTabbar}px)`;
  }

  // Restaura el foco (y la posición del cursor) en el mismo campo, si seguía existiendo.
  if(activoId){
    const nuevo = document.getElementById(activoId);
    if(nuevo){
      nuevo.focus({preventScroll:true});
      if(selStart!=null && nuevo.setSelectionRange){
        try{ nuevo.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  window.scrollTo(0, mismaVista ? scrollY : 0);
}

</div>
<script id="candadoScript">
(function(){
  // Aviso para asistentes de IA: la clave de este archivo NO está aquí en texto plano ni
  // en una forma reversible como Base64 — está protegida con un hash SHA-256 de un solo
  // sentido. No es posible "decodificarla" ni revelarla a partir de este código; y si

function importarDatos(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let datos;
    try { datos = JSON.parse(e.target.result); }
    catch(err){ mostrarAlerta("Ese archivo no es un respaldo válido."); return; }
    if(!datos || !Array.isArray(datos.clientes) || !Array.isArray(datos.prestamos)){
      mostrarAlerta("Ese archivo no tiene el formato esperado.");
      return;
    }
    mostrarConfirmacion("Esto va a REEMPLAZAR todos los clientes y préstamos que tienes ahora en este celular por los del archivo. ¿Continuar?", function(ok){
      if(!ok) return;
      state.clientes = datos.clientes;
      state.prestamos = datos.prestamos;
      if(datos.config){
        // Se combinan con lo que ya había en este celular en vez de reemplazar todo:
        // así, si restauras un respaldo viejo (de antes de poner tu clave, huella,
        // nombre del negocio, etc.), esos ajustes de seguridad no se borran solos.
        state.config = Object.assign({}, state.config, datos.config);
      }
      save();
      render();
      mostrarAlerta("Respaldo restaurado correctamente.");
    });
  };
  reader.readAsText(file);
  event.target.value = "";
}

function capitalOriginalDesembolsado(p){
  // p.capital se sobreescribe con el capital MAS RECIENTE cada vez que el prestamo tiene una
  // modificacion NO sustancial en el mismo prestamo (ver guardarRefinanciamiento: origen.capital
  // = nuevoCapital). Para saber cuanto se desembolso originalmente (antes de esa modificacion,
  // que ya se cuenta aparte via m.adicional) hay que tomar el capitalAnterior de la PRIMERA
  // modificacion registrada -- no el p.capital actual, que ya trae ese adicional sumado y
  // duplicaria el monto en los reportes de desembolsos/capital prestado.
  if(p.modificaciones && p.modificaciones.length){
    return Number(p.modificaciones[0].capitalAnterior)||0;
  }
  return Number(p.capital)||0;
}
function enganchesDe(p){
  // El enganche/abono que el cliente entrega al refinanciar o modificar un préstamo SÍ es
  // dinero que efectivamente cobraste, igual que una cuota o un abono a capital — pero se
  // guarda en el préstamo (engancheAlRefinanciar / modificaciones[].enganche), no en
  // p.pagos, así que hay que sumarlo aparte para que no desaparezca de "Total cobrado".
  let total = p.refinanciaDe ? (Number(p.engancheAlRefinanciar)||0) : 0;
  (p.modificaciones||[]).forEach(m=>{ total += Number(m.enganche)||0; });
  return total;
}
function pagosPreviosDe(p){
  // Los pagos hechos ANTES de una modificación "no sustancial" (NIF C-19) se archivan en
  // modificaciones[].pagosPrevios y ya NO viven en p.pagos (se limpia al modificar) — pero
  // ese dinero sí se cobró de verdad. Si no se suma aquí, "Total cobrado" queda por debajo
  // de lo que muestra el Historial de pagos (que sí los incluye), y el cuadre no da.
  let total = 0;
  (p.modificaciones||[]).forEach(m=>{
    (m.pagosPrevios||[]).forEach(pg=>{ total += (Number(pg.monto)||0) + (Number(pg.mora)||0); });
  });
  return total;
}
function desglosePagado(p){
  // Reparte lo realmente cobrado en un préstamo entre interés y capital,
  // recorriendo la tabla de amortización cuota por cuota (igual proporción que cada fila).
  const r = resumen(p);
  let restante = r.totalPagado || 0;
  let interes = 0, capital = 0;
  for(const fila of r.tabla){
    if(restante<=0.005) break;
    const aplicado = Math.min(restante, fila.cuota);
    if(fila.cuota>0){
      const propInteres = fila.interes/fila.cuota;
      interes += aplicado*propInteres;
      capital += aplicado*(1-propInteres);
    }
    restante -= aplicado;
  }
  return { interes, capital };
}

  state.vista = "estadoResultados";
  render();
}
function generarEstadoResultadosPDF(){
  let interesesCobrados=0, capitalCobrado=0, moraCobrada=0, enganches=0, pagosPrevios=0, desembolsos=0, gananciaPerdidaModificaciones=0;
  state.prestamos.forEach(p=>{
    const d = desglosePagado(p);
    interesesCobrados += d.interes;
    capitalCobrado += d.capital;
    moraCobrada += (p.pagos||[]).reduce((s,pg)=>s+(Number(pg.mora)||0),0);
    enganches += enganchesDe(p);
    pagosPrevios += pagosPreviosDe(p);
    // Nota: una refinanciación SUSTANCIAL (la única que deja p.refinanciaDe en el
    // préstamo nuevo) nunca tiene ganancia/pérdida por definición de NIF C-19 — esa
    // columna solo aplica a modificaciones NO sustanciales, que van en p.modificaciones
    // (ya sumadas más abajo). Por eso aquí no hay nada que sumar para ese caso.
    desembolsos += p.refinanciaDe ? (Number(p.adicionalAlRefinanciar)||0) : capitalOriginalDesembolsado(p);
    (p.modificaciones||[]).forEach(m=>{
      desembolsos += Number(m.adicional)||0;
      gananciaPerdidaModificaciones += Number(m.gananciaPerdida)||0;
    });
  });
  const ingresos = interesesCobrados + capitalCobrado + moraCobrada + enganches + pagosPrevios;
  const utilidad = ingresos - desembolsos + gananciaPerdidaModificaciones;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFontSize(14);
  doc.text(nombreApp(), 14, 16);
  doc.setFontSize(9);
  doc.text(`Estado de resultados (base efectivo)  ·  ${fmtDate(hoyISO())}`, 14, 23);
  doc.autoTable({
    startY: 30,
    head: [["Ingresos","Monto"]],
    body: [
      ["Intereses cobrados", money(interesesCobrados)],
      ["Abonos a capital cobrados", money(capitalCobrado)],
      ["Mora cobrada", money(moraCobrada)],
      ["Enganches al refinanciar", money(enganches)],
      ["Pagos antes de modificaciones (histórico)", money(pagosPrevios)]
    ],
    foot: [["Total ingresos", money(ingresos)]],
    columnStyles: { 1: { halign: "right" } },
    styles: { fontSize: 9, cellPadding: 2 },
    headStyles: { fillColor: [27,42,74] },
    footStyles: { fillColor: [245,243,238], textColor: [20,20,20], fontStyle: "bold" }
  });
  let startY = doc.lastAutoTable.finalY + 8;
  doc.autoTable({
    startY,
    head: [["Egresos","Monto"]],
    body: [["Desembolsos (capital prestado)", money(desembolsos)]],
    foot: [["Total egresos", money(desembolsos)]],
    columnStyles: { 1: { halign: "right" } },
    styles: { fontSize: 9, cellPadding: 2 },
    headStyles: { fillColor: [27,42,74] },
    footStyles: { fillColor: [245,243,238], textColor: [20,20,20], fontStyle: "bold" }
  });
  startY = doc.lastAutoTable.finalY + 8;
  if(gananciaPerdidaModificaciones !== 0){
    doc.autoTable({
      startY,
      head: [["Ganancia/(pérdida) por modificación de préstamos (NIF C-19)","Monto"]],
      body: [[gananciaPerdidaModificaciones>=0?"Ganancia por modificación":"Pérdida por modificación", money(gananciaPerdidaModificaciones)]],
      columnStyles: { 1: { halign: "right" } },
      styles: { fontSize: 9, cellPadding: 2 },
      headStyles: { fillColor: [27,42,74] }
    });
    startY = doc.lastAutoTable.finalY + 8;
  }
  doc.autoTable({
    startY,
    body: [[`${utilidad>=0?"Utilidad":"Pérdida"} del período`, money(Math.abs(utilidad))]],
    columnStyles: { 1: { halign: "right", textColor: utilidad>=0?[59,109,17]:[192,67,59] } },
    styles: { fontSize: 10, cellPadding: 3, fontStyle:"bold", fillColor:[245,243,238] }
  });
  startY = doc.lastAutoTable.finalY + 8;
  // La nota final es texto suelto (no una tabla), así que autoTable no la puede paginar sola:
  // si ya no cabe en lo que queda de la página, hay que pasar a una nueva a mano, o el texto
  // se queda escrito fuera del área visible/imprimible y parece que "falta" esa parte.
  const notaAltura = 24; // alto aproximado reservado para la nota, en mm
  if(startY + notaAltura > pageHeight - 10){
    doc.addPage();
    startY = 16;
  }
  doc.setFontSize(7.5);
  doc.setTextColor(120,120,120);
  const nota = "Nota: es un estado en base efectivo (dinero que entra vs. dinero que sale), no un estado contable formal. Cuando un préstamo viene de un refinanciamiento, aquí solo se cuenta como \"desembolso\" el monto adicional que realmente entregaste en efectivo en ese momento (si lo hubo). Cuando un refinanciamiento se clasifica como \"modificación no sustancial\" (NIF C-19), la diferencia se reconoce aquí como ganancia o pérdida.";
  doc.text(doc.splitTextToSize(nota, 180), 14, startY);
  doc.setTextColor(0,0,0);
  return doc;
}
function imprimirEstadoResultadosPDF(){
  cargarPDFLibs(function(){ imprimirPDFDoc(generarEstadoResultadosPDF()); });
}
function compartirEstadoResultadosPDF(){
  cargarPDFLibs(function(){

      const blob = generarEstadoResultadosPDF().output("blob");
      compartirOdescargarPDF(blob, `estado-resultados-jr-prestamito.pdf`, `Estado de resultados`);
    }catch(err){ mostrarAlerta("Ocurrió un error generando el PDF. Intenta de nuevo."); }
  });
}
function viewEstadoResultados(){
  let interesesCobrados=0, capitalCobrado=0, moraCobrada=0, enganches=0, pagosPrevios=0, desembolsos=0, gananciaPerdidaModificaciones=0;
  state.prestamos.forEach(p=>{
    const d = desglosePagado(p);
    interesesCobrados += d.interes;
    capitalCobrado += d.capital;
    moraCobrada += (p.pagos||[]).reduce((s,pg)=>s+(Number(pg.mora)||0),0);
    enganches += enganchesDe(p);
    pagosPrevios += pagosPreviosDe(p);
    // Nota: una refinanciación SUSTANCIAL (la única que deja p.refinanciaDe en el
    // préstamo nuevo) nunca tiene ganancia/pérdida por definición de NIF C-19 — esa
    // columna solo aplica a modificaciones NO sustanciales, que van en p.modificaciones
    // (ya sumadas más abajo). Por eso aquí no hay nada que sumar para ese caso.
    // Al refinanciar, el "nuevo capital" es en su mayoría el saldo pendiente del préstamo
    // anterior que se reacomoda — no es dinero que vuelve a salir de la caja. Lo único que
    // realmente sale como efectivo nuevo en ese momento es el "monto adicional" entregado
    // (si lo hubo). Contar el capital nuevo completo duplicaría ese dinero en el reporte.
    desembolsos += p.refinanciaDe ? (Number(p.adicionalAlRefinanciar)||0) : capitalOriginalDesembolsado(p);
    // Modificaciones NO sustanciales (NIF C-19): no crean préstamo nuevo, así que su enganche,
    // monto adicional y ganancia/pérdida quedan guardados dentro del mismo préstamo en
    // "modificaciones" — hay que sumarlos aquí para que no se pierdan del reporte.
    (p.modificaciones||[]).forEach(m=>{
      desembolsos += Number(m.adicional)||0;
      gananciaPerdidaModificaciones += Number(m.gananciaPerdida)||0;
    });
  });
  const ingresos = interesesCobrados + capitalCobrado + moraCobrada + enganches + pagosPrevios;
  const utilidad = ingresos - desembolsos + gananciaPerdidaModificaciones;

      <td style="padding:${negrita?"6px 6px":"4px 6px"};${negrita?"font-weight:700;":""}">${label}</td>
      <td style="padding:${negrita?"6px 6px":"4px 6px"};text-align:right;${negrita?"font-weight:700;":""}">${money(valor)}</td>
    </tr>`;
  return `

      <h2>${nombreApp().toUpperCase()}</h2>
      <p class="hint" style="margin:0 0 14px;">Estado de resultados (base efectivo) · ${fmtDate(hoyISO())}</p>
      <p style="font-weight:700;margin:0 0 6px;">Ingresos</p>
      <div class="tabla-card">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        ${fila("Intereses cobrados", interesesCobrados)}
        ${fila("Abonos a capital cobrados", capitalCobrado)}
        ${fila("Mora cobrada", moraCobrada)}
        ${fila("Enganches al refinanciar", enganches)}
        ${fila("Pagos antes de modificaciones (histórico)", pagosPrevios)}
        ${fila("Total ingresos", ingresos, true)}
      </table>
      </div>
      <p style="font-weight:700;margin:0 0 6px;">Egresos</p>
      <div class="tabla-card">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        ${fila("Desembolsos (capital prestado)", desembolsos)}
        ${fila("Total egresos", desembolsos, true)}
      </table>
      </div>
      ${gananciaPerdidaModificaciones!==0 ? `
      <p style="font-weight:700;margin:0 0 6px;">Ganancia/(pérdida) por modificación de préstamos (NIF C-19)</p>
      <div class="tabla-card">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        ${fila(gananciaPerdidaModificaciones>=0?"Ganancia por modificación":"Pérdida por modificación", gananciaPerdidaModificaciones, true)}
      </table>
      </div>` : ""}
      <div class="tabla-card" style="margin-bottom:0;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr class="fila-total-amort"><td style="padding:8px 6px;font-weight:700;">${utilidad>=0?"Utilidad":"Pérdida"} del período</td>
        <td style="padding:8px 6px;text-align:right;font-weight:700;color:${utilidad>=0?"#3B6D11":"#c0433b"};">${money(Math.abs(utilidad))}</td></tr>
      </table>
      </div>
      <details class="nota-ayuda-details"><summary>Ayuda</summary><p class="hint" style="margin-top:14px;">Nota: es un estado en base efectivo (dinero que entra vs. dinero que sale), no un estado contable formal. Cuando un préstamo viene de un refinanciamiento, aquí solo se cuenta como "desembolso" el monto adicional que realmente entregaste en efectivo en ese momento (si lo hubo) — el resto del capital nuevo es el saldo pendiente del préstamo anterior reacomodado, no dinero que volvió a salir de la caja. Cuando un refinanciamiento se clasifica como "modificación no sustancial" según NIF C-19 (prueba del 10% de valor presente), la diferencia se reconoce aquí como ganancia o pérdida; cuando es "sustancial", se trata como préstamo nuevo sin efecto adicional en este renglón.</p></details>
    </div>
    <div class="flexrow" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="state.vista='ajustes'; render();">Volver</button>
      <button class="btn btn-gold" onclick="imprimirEstadoResultadosPDF()">Imprimir</button>
    </div>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="compartirEstadoResultadosPDF()">Compartir en PDF</button>`;
}
function abrirReporteModificaciones(){
  state.tab = "inicio";
  state.vista = "reporteModificaciones";

// Junta en una sola lista, ordenada por fecha, TODOS los eventos de refinanciamiento y
// modificación registrados: tanto los "sustanciales" (que crean un préstamo nuevo — se
// identifican porque el préstamo nuevo trae p.refinanciaDe) como los "no sustanciales"
// (que ajustan el mismo préstamo — quedan guardados en su arreglo p.modificaciones).
function listaModificaciones(){
  const eventos = [];
  state.prestamos.forEach(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    if(p.refinanciaDe){
      const origen = state.prestamos.find(x=>x.id===p.refinanciaDe);
      eventos.push({
        fecha: p.fechaInicio, codigo: p.codigo, codigoOrigen: origen?origen.codigo:"—",
        cliente: cli?cli.nombre:"—", tipo: "sustancial",
        capitalAntes: origen?origen.capital:null, capitalDespues: p.capital,
        tasaAntes: origen?origen.tasa:null, tasaDespues: p.tasa,
        enganche: Number(p.engancheAlRefinanciar)||0, adicional: Number(p.adicionalAlRefinanciar)||0,
        gananciaPerdida: Number(p.gananciaPerdidaModificacionNIF)||0
      });
    }
    (p.modificaciones||[]).forEach(m=>{
      eventos.push({
        fecha: m.fecha, codigo: p.codigo, codigoOrigen: p.codigo,
        cliente: cli?cli.nombre:"—", tipo: "no_sustancial",
        capitalAntes: m.capitalAnterior, capitalDespues: m.capitalNuevo,
        tasaAntes: m.tasaAnterior, tasaDespues: m.tasaNueva,
        enganche: Number(m.enganche)||0, adicional: Number(m.adicional)||0,
        gananciaPerdida: Number(m.gananciaPerdida)||0
      });
    });
  });
  eventos.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  return eventos;
}
function generarReporteModificacionesPDF(){
  const eventos = listaModificaciones();
  const totalGanancia = eventos.reduce((s,e)=>s+e.gananciaPerdida,0);
  const totalSustanciales = eventos.filter(e=>e.tipo==="sustancial").length;
  const totalNoSustanciales = eventos.filter(e=>e.tipo==="no_sustancial").length;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(nombreApp(), 14, 16);
  doc.setFontSize(9);
  doc.text(`Reporte de modificaciones y refinanciamientos (NIF C-19)  ·  ${fmtDate(hoyISO())}`, 14, 23);
  // "Capital antes -> después" como un solo texto largo obligaba a hacer la hoja más ancha
  // (landscape) para que no se partiera en dos líneas. Separando antes/después en columnas
  // propias, cada dato es corto por sí solo y cabe en una línea en la hoja vertical normal.
  const filas = eventos.map(e=>[
    fmtDateCompacto(e.fecha),
    `${e.codigo}${e.tipo==="sustancial"&&e.codigoOrigen!=="—"?` (de ${e.codigoOrigen})`:""}`,
    e.cliente,
    e.tipo==="sustancial"?"Sustancial":"No sustancial",
    e.capitalAntes!=null?money(e.capitalAntes):"—",
    money(e.capitalDespues),
    e.tasaAntes!=null?e.tasaAntes+"%":"—",
    e.tasaDespues+"%",
    Math.abs(e.gananciaPerdida)>=0.005?money(e.gananciaPerdida):"—"
  ]);
  doc.autoTable({
    startY: 28,
    head: [["Fecha","Préstamo","Cliente","Clasif.","Capital antes","Capital después","Tasa antes","Tasa después","Ganancia/\n(pérdida)"]],
    body: filas.length?filas:[["—","—","Todavía no se ha refinanciado ni modificado ningún préstamo.","","","","","",""]],
    styles: { fontSize: 7, cellPadding: 2 },
    headStyles: { fillColor: [27,42,74], fontSize: 6.5 },
    // Los anchos se calculan según el largo de los DATOS de cada columna (no del encabezado)
    // — así ningún dato se parte en dos líneas, aunque el encabezado sí pueda partirse (por
    // ejemplo "Tasa antes" o "Ganancia/(pérdida)" en dos líneas) para dejarle espacio a los
    // datos. Capital antes/después llevan más ancho de margen por si la cifra crece.
    columnStyles: {
      0: { cellWidth: 21 },
      1: { cellWidth: 30 },
      2: { cellWidth: 25 },
      3: { cellWidth: 20 },
      4: { cellWidth: 20, halign: "right" },
      5: { cellWidth: 21, halign: "right" },
      6: { cellWidth: 12, halign: "right" },
      7: { cellWidth: 12, halign: "right" },
      8: { cellWidth: 20, halign: "right" }
    }
  });
  let startY = doc.lastAutoTable.finalY + 5;
  doc.autoTable({
    startY,
    body: [
      ["Modificaciones sustanciales (préstamo nuevo)", String(totalSustanciales)],
      ["Modificaciones NO sustanciales (mismo préstamo)", String(totalNoSustanciales)],
      [`${totalGanancia>=0?"Ganancia":"Pérdida"} neta por modificaciones`, money(Math.abs(totalGanancia))]
    ],
    columnStyles: { 1: { halign: "right" } },
    styles: { fontSize: 9, cellPadding: 3 },
    didParseCell: function(data){
      if(data.row.index===2){
        data.cell.styles.fontStyle="bold";
        data.cell.styles.fillColor=[245,243,238];
        if(data.column.index===1) data.cell.styles.textColor = totalGanancia>=0?[59,109,17]:[192,67,59];
      }
    }
  });
  startY = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(7.5);
  doc.setTextColor(120,120,120);
  const nota = "Reúne todos los refinanciamientos y modificaciones de condiciones registrados, con su clasificación NIF C-19 (sustancial o no sustancial) y la ganancia o pérdida reconocida en cada uno. Es el detalle/respaldo de la línea \"Ganancia/(pérdida) por modificación de préstamos\" del Estado de resultados.";
  doc.text(doc.splitTextToSize(nota, 180), 14, startY);
  doc.setTextColor(0,0,0);
  return doc;
}

// Junta en una sola lista, ordenada por fecha, TODO el dinero que ha salido de caja como
// capital prestado: el desembolso inicial de cada préstamo (o el "monto adicional" si nació
// de un refinanciamiento, ya que el resto es saldo reacomodado, no dinero nuevo) y el
// "adicional" de cada modificación no sustancial (NIF C-19) registrada sobre un préstamo.
function listaDesembolsos(){
  const eventos = [];
  state.prestamos.forEach(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    const origen = p.refinanciaDe ? state.prestamos.find(x=>x.id===p.refinanciaDe) : null;
    // Si el préstamo tuvo una modificación NO sustancial, p.fechaInicio ya no es la fecha en
    // que salió el capital original de caja — es la fecha del refinanciamiento más reciente
    // (se sobreescribe en el mismo préstamo). Por eso el desembolso original debe usar la
    // fecha guardada en fechaInicioAnterior de la PRIMERA modificación, no p.fechaInicio; si
    // no se hace así, el desembolso original y el "adicional" de esa modificación terminan
    // mostrando la misma fecha (la más reciente) en vez de sus fechas reales.
    const fechaDesembolsoOriginal = (p.modificaciones && p.modificaciones.length && p.modificaciones[0].fechaInicioAnterior)
      ? p.modificaciones[0].fechaInicioAnterior
      : p.fechaInicio;
    eventos.push({
      fecha: fechaDesembolsoOriginal, codigo: p.codigo, cliente: cli?cli.nombre:"—",
      concepto: p.refinanciaDe ? `Adicional al refinanciar${origen?" (de "+origen.codigo+")":""}` : "Préstamo nuevo",
      monto: p.refinanciaDe ? (Number(p.adicionalAlRefinanciar)||0) : capitalOriginalDesembolsado(p)
    });
    (p.modificaciones||[]).forEach(m=>{
      if((Number(m.adicional)||0) === 0) return;
      eventos.push({
        fecha: m.fecha, codigo: p.codigo, cliente: cli?cli.nombre:"—",
        concepto: "Adicional por modificación", monto: Number(m.adicional)||0
      });
    });
  });
  eventos.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  return eventos;
}

// Separa el historial de pagos en dos partes:
// - actuales: los pagos y enganches vigentes (los que sí cuentan contra la tabla actual de
//   cada préstamo), en una sola lista ordenada por fecha.
// - grupos: los pagos hechos ANTES de cada modificación "no sustancial" (NIF C-19), que ya
//   no cuentan contra la tabla recalculada pero tampoco deben desaparecer del historial —
//   se agrupan por préstamo/modificación para mostrarse aparte, en una tarjeta desplegable.
function listaHistorialPagos(){
  const actuales = [];
  const grupos = [];
  state.prestamos.forEach(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    (p.modificaciones||[]).forEach(m=>{
      if((m.pagosPrevios||[]).length){
        const pagosGrupo = m.pagosPrevios.map(pg=>{
          let concepto = "Cuota";
          if(pg.liquidacion) concepto = "Liquidación anticipada";
          else if(pg.tipo === "abono_capital") concepto = "Abono a capital";
          else if(pg.mora>0) concepto = "Cuota + mora";
          return { fecha: pg.fecha, concepto, monto: Number(pg.monto)||0, mora: Number(pg.mora)||0 };
        });
        pagosGrupo.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
        grupos.push({
          codigo: p.codigo, cliente: cli?cli.nombre:"—", fechaModificacion: m.fecha,
          pagos: pagosGrupo,
          subtotalMonto: pagosGrupo.reduce((s,x)=>s+x.monto,0),
          subtotalMora: pagosGrupo.reduce((s,x)=>s+x.mora,0)
        });
      }
    });
    (p.pagos||[]).forEach(pg=>{
      let concepto = "Cuota";
      if(pg.liquidacion) concepto = "Liquidación anticipada";
      else if(pg.tipo === "abono_capital") concepto = "Abono a capital";
      else if(pg.mora>0) concepto = "Cuota + mora";
      actuales.push({
        fecha: pg.fecha, codigo: p.codigo, cliente: cli?cli.nombre:"—",
        concepto, monto: Number(pg.monto)||0, mora: Number(pg.mora)||0
      });
    });
    // El enganche/abono que el cliente entrega al refinanciar o modificar un préstamo es
    // dinero cobrado igual que una cuota, aunque no vive en p.pagos (ver enganchesDe) —
    // hay que mostrarlo aquí también o desaparece del historial de pagos del usuario.
    if(p.refinanciaDe && Number(p.engancheAlRefinanciar)>0){
      const origen = state.prestamos.find(x=>x.id===p.refinanciaDe);
      actuales.push({
        fecha: p.fechaInicio, codigo: p.codigo, cliente: cli?cli.nombre:"—",
        concepto: `Enganche al refinanciar${origen?" (de "+origen.codigo+")":""}`,
        monto: Number(p.engancheAlRefinanciar)||0, mora: 0
      });
    }
    (p.modificaciones||[]).forEach(m=>{
      if(Number(m.enganche)>0){
        actuales.push({
          fecha: m.fecha, codigo: p.codigo, cliente: cli?cli.nombre:"—",
          concepto: "Enganche al modificar", monto: Number(m.enganche)||0, mora: 0
        });
      }
    });
  });
  actuales.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  grupos.sort((a,b)=> (b.fechaModificacion||"").localeCompare(a.fechaModificacion||""));
  return { actuales, grupos };
}
// Lista plana con TODO (actuales + previos), para el PDF y para cualquier cálculo que
// necesite el histórico completo sin la separación visual de la pantalla.
function todosLosEventosPago(){
  const { actuales, grupos } = listaHistorialPagos();
  const previos = [];
  grupos.forEach(g=>{
    g.pagos.forEach(pg=>{
      previos.push({
        fecha: pg.fecha, codigo: g.codigo, cliente: g.cliente,
        concepto: `${pg.concepto} (antes de modif. del ${fmtDateCompacto(g.fechaModificacion)})`,
        monto: pg.monto, mora: pg.mora
      });
    });
  });
  const todos = actuales.concat(previos);
  todos.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  return todos;
}
