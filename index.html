async function subirNube(silencioso){
  const url = (state.config.syncUrl||"").trim();
  const key = (state.config.syncKey||"").trim();
  if(!url || !key){ if(!silencioso) mostrarAlerta("Primero ingresa la URL y la clave de la aplicación web (ver instrucciones)."); return; }
  if(state.syncBusy) return;
  state.syncBusy = "push"; if(!silencioso) render();
  try{
    const payload = { clientes: state.clientes, prestamos: state.prestamos, config: { tasaMoraDiaria: state.config.tasaMoraDiaria } };
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "action=push&key=" + encodeURIComponent(key), {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.ok){
      state.config.ultimaSubida = new Date().toISOString();
      save({ sinAutoSync:true });
      if(!silencioso) mostrarAlerta("Datos subidos correctamente a la nube.");
    } else {
      if(!silencioso) mostrarAlerta("Error al subir: " + (data.error || "desconocido"));
    }
  } catch(err){
    if(!silencioso) mostrarAlerta("No se pudo conectar con la nube. Revisa la URL, la clave y tu conexión a internet.");
  }
  state.syncBusy = null; render();
}

function descargarNube(){
  const url = (state.config.syncUrl||"").trim();
  const key = (state.config.syncKey||"").trim();
  if(!url || !key){ mostrarAlerta("Primero ingresa la URL y la clave de la aplicación web (ver instrucciones)."); return; }
  if(state.syncBusy) return;
  mostrarConfirmacion("Esto va a REEMPLAZAR los clientes y préstamos de este celular con los que están guardados en la nube. ¿Continuar?", function(ok){
    if(!ok) return;
    _descargarNubeInterna(url, key);
  });
}
async function _descargarNubeInterna(url, key){
  state.syncBusy = "pull"; render();
  try{
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "action=pull&key=" + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok && data.datos){
      state.clientes = data.datos.clientes || [];
      state.prestamos = data.datos.prestamos || [];
      if(data.datos.config && data.datos.config.tasaMoraDiaria!==undefined){
        state.config.tasaMoraDiaria = data.datos.config.tasaMoraDiaria;
      }
      state.config.ultimaDescarga = new Date().toISOString();
      save({sinAutoSync:true});
      mostrarAlerta("Datos descargados correctamente.");
    } else if(data.ok && !data.datos){
      mostrarAlerta("La nube todavía no tiene datos guardados. Primero sube los datos desde algún celular.");
    } else {
      mostrarAlerta("Error al descargar: " + (data.error || "desconocido"));
    }
  } catch(err){
    mostrarAlerta("No se pudo conectar con la nube. Revisa la URL, la clave y tu conexión a internet.");
  }
  state.syncBusy = null; render();
}

    cobrado += (p.pagos||[]).reduce((s,pg)=>s+(Number(pg.monto)||0)+(Number(pg.mora)||0),0) + enganchesDe(p) + pagosPreviosDe(p);
    capitalActual += Number(r.capitalPendiente)||0;
    if(r.estado==="Activo"){ activos++; if(r.proximaFecha && diasAtraso(r.proximaFecha)>0) vencidos++; }
  });
  let prox = state.prestamos.map(p=>({p, r:resumen(p)}))
    .filter(x=>x.r.estado==="Activo" && x.r.proximaFecha && [0,1].includes(diasParaVencer(x.r.proximaFecha)))
    .sort((a,b)=> new Date(a.r.proximaFecha) - new Date(b.r.proximaFecha));

  const modoOscuro = !!state.config.temaOscuro;

  </div>
  <p class="section-title">Clientes</p>
  <div class="row-card"><div class="flex-gap">${ICONS.users.replace("currentColor",modoOscuro?'#F2F2F2':NAVY)}<span>${state.clientes.length} Registrados</span></div></div>
  <p class="section-title" style="margin-top:16px;">Próximos a vencer</p>`;

  if(prox.length===0) html += `<p class="empty">${state.prestamos.length===0 ? "Todavía no tienes préstamos registrados." : "No tienes cuotas por cobrar hoy ni mañana."}</p>`;
  prox.forEach(({p,r})=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    html += `<div class="row-card" style="cursor:pointer;" onclick="verDetalle('${p.id}')"><div><p class="name">${cli?cli.nombre:"—"}</p><p class="sub">${p.codigo} · vence ${fmtDate(r.proximaFecha)}</p></div>${badge("Por cobrar")}</div>`;
  });
  return html;
}
function abrirAjustes(){
  state.tab = "inicio";
  state.vista = (state.config.pin && state.config.pedirClaveEnAjustes!==false) ? "ajustesClave" : "ajustes";
  state._errorClaveAjustes = false;
  state._huellaAjustesYaIntentada = false;
  render();
}
async function usarHuellaAjustes(){
  if(!(window.PublicKeyCredential && state.config.huellaCredId)) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const credId = base64AUint8(state.config.huellaCredId);
    const resultado = await navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        allowCredentials: [{ id: credId, type:"public-key", transports:["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    });
    if(resultado){
      state.vista = "ajustes";
      state._errorClaveAjustes = false;
      render();
    }
  }catch(err){
    // Canceló o falló la verificación — se queda en la pantalla de clave de Ajustes, sin drama.
  }
}
function verificarClaveAjustes(){
  const inp = document.getElementById("claveAjustes");
  const val = (inp ? inp.value : "").trim();
  if(val !== "" && val === String(state.config.pin||"")){
    state.vista = "ajustes";
    state._errorClaveAjustes = false;
    render();
  } else {
    state._errorClaveAjustes = true;
    render();
    const inp2 = document.getElementById("claveAjustes");
    if(inp2) inp2.focus();
  }
}

function guardarCliente(){
  const nombre = document.getElementById("f_nombre").value.trim();
  if(!nombre){ mostrarAlerta("El nombre es obligatorio."); return; }

  let cedula = soloDigitos(document.getElementById("f_cedula").value);
  let celular = soloDigitos(document.getElementById("f_celular").value);

  if(cedula && cedula.length !== 13){
    mostrarAlerta("La cédula debe tener exactamente 13 dígitos (formato hondureño). Puedes dejarla vacía si no la tienes a mano.");
    return;
  }
  if(celular && celular.length !== 8){
    mostrarAlerta("El celular debe tener 8 dígitos (formato hondureño), sin incluir el 504.");
    return;
  }
  if(cedula){
    const dup = state.clientes.find(c => c.id !== state.clienteEditId && soloDigitos(c.cedula) === cedula);
    if(dup){ mostrarAlerta(`Esa cédula ya está registrada a nombre de ${dup.nombre}.`); return; }
    cedula = cedula.replace(/(\d{4})(\d{4})(\d{5})/, "$1-$2-$3");
  }
  if(celular){
    const dupCel = state.clientes.find(c => c.id !== state.clienteEditId && soloDigitos(c.celular) === celular);
    if(dupCel){ mostrarAlerta(`Ese número de celular ya está registrado a nombre de ${dupCel.nombre}.`); return; }
    celular = celular.replace(/(\d{4})(\d{4})/, "$1-$2");
  }

  const datos = {
    nombre,
    celular,
    cedula,
    direccion: document.getElementById("f_direccion").value
  };
  if(state.clienteEditId){
    const c = state.clientes.find(x=>x.id===state.clienteEditId);
    Object.assign(c, datos);
  } else {
    const codigo = nextCode("C", state.clientes);
    state.clientes.push({ id: uid(), codigo, ...datos });
  }
  state.showFormCliente = false;
  state.clienteEditId = null;
  save(); render();
}
function eliminarCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  const prestamosCliente = state.prestamos.filter(p=>p.clienteId===id);
  let msg = `¿Seguro que quieres eliminar a "${c.nombre}"? Esta acción no se puede deshacer.`;
  if(prestamosCliente.length>0){
    msg = `"${c.nombre}" tiene ${prestamosCliente.length} préstamo(s) registrado(s) (${prestamosCliente.map(p=>p.codigo).join(", ")}).\n\n`+
      `Si lo eliminas, esos préstamos quedarán sin cliente asignado, pero NO se borran automáticamente.\n\n`+
      `¿Seguro que quieres eliminar a "${c.nombre}"? Esta acción no se puede deshacer.`;
  }
  confirmarConClave(msg, function(ok){
    if(!ok) return;
    state.clientes = state.clientes.filter(x=>x.id!==id);
    save(); render();
  }, { textoAceptar:"Eliminar", peligro:true });
}

function viewPrestamos(){
  if(state.vista==="nuevo" && !window._nf) state.vista = "lista"; // resguardo: formulario no restaurado
  if(state.vista==="refinanciar" && !window._rf) state.vista = "lista"; // resguardo: formulario no restaurado
  if(state.vista==="nuevo") return viewNuevoPrestamo();
  if(state.vista==="detalle") return viewDetallePrestamo();
  if(state.vista==="cartera") return viewCartera();
  if(state.vista==="refinanciar") return viewRefinanciar();

  let html = `<div class="toprow" style="margin-bottom:16px;">
    <input id="buscarPrestamo" style="flex:1;" placeholder="Buscar préstamo o cliente" value="${state.qPrestamos}" oninput="state.qPrestamos=this.value; render()">
    <button class="iconbtn" onclick="abrirNuevoPrestamo()">+</button>
  </div>`;
  const filtrados = state.prestamos.filter(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    const texto = ((cli?cli.nombre:"")+" "+p.codigo).toLowerCase();
    return texto.includes(state.qPrestamos.toLowerCase());
  });
  if(state.prestamos.length===0) html += `<p class="empty">Todavía no tienes préstamos.</p>`;
  else if(filtrados.length===0) html += `<p class="empty">No hay préstamos que coincidan con la búsqueda.</p>`;

  const filaPrestamo = (p)=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    const r = resumen(p);
    const atraso = r.proximaFecha ? diasAtraso(r.proximaFecha) : 0;
    const nVenc = atraso>0 ? cuotasVencidas(r) : 0;
    return `<div class="row-card" style="cursor:pointer;" onclick="verDetalle('${p.id}')">
      <div><p class="name">${cli?cli.nombre:"Cliente eliminado"}</p>
      <p class="sub">${p.codigo} · ${p.metodo.split(" (")[0]}</p>
      <p class="monto-navy" style="font-size:13px;margin:4px 0 0;">${money(r.saldoPendiente)}</p></div>
      <div style="text-align:right;">${badge(atraso>0?"Vencido":r.estado)}${atraso>0?`<p class="hint" style="margin:2px 0 0;color:#A32D2D;">${nVenc} cuota${nVenc===1?"":"s"}</p>`:""}</div>
    </div>`;
  };
  // Se agrupan por estado (en vez de una sola lista mezclada) para que sea más fácil ver de
  // un vistazo cuáles préstamos siguen activos y cuáles ya están cerrados de una forma u
  // otra. Se calcula el estado de cada uno una sola vez aquí, no dentro de cada grupo, para
  // no llamar resumen() dos veces por préstamo.
  const conEstado = filtrados.map(p=>({p, estado: resumen(p).estado}));
  const activos = conEstado.filter(x=>x.estado==="Activo").map(x=>x.p);
  const pagados = conEstado.filter(x=>x.estado==="Pagado").map(x=>x.p);
  const refinanciados = conEstado.filter(x=>x.estado==="Refinanciado").map(x=>x.p);
  const grupos = [
    { label:"Activos", lista:activos },
    { label:"Pagados", lista:pagados },
    { label:"Refinanciados", lista:refinanciados }
  ];
  grupos.forEach(g=>{
    if(g.lista.length===0) return;
    html += `<p class="section-title" style="margin-top:16px;">${g.label.toUpperCase()} (${g.lista.length})</p>`;
    g.lista.forEach(p=>{ html += filaPrestamo(p); });
  });
  return html;
}

const PLANTILLA_RECORDATORIO_DEFECTO = "Hola {nombre}, su préstamo {codigo} tiene {cuotas} vencida(s) desde el {fecha} ({dias} de atraso), por un total de {monto}. Le agradecemos ponerse al día lo antes posible. Cualquier duda, con gusto le atendemos. ¡Gracias!";
const PLANTILLA_PENDIENTE_DEFECTO = "Hola {nombre}, le recordamos que su préstamo {codigo} tiene una cuota de {cuota} pendiente de cobro, con fecha {fecha}. Cualquier duda, con gusto le atendemos. ¡Gracias!";
function diasParaVencer(fecha){
  if(!fecha) return null;
  const hoy = hoyISO();
  return Math.round((new Date(fecha) - new Date(hoy))/86400000);
}
// Cuenta cuántas cuotas programadas ya vencieron (fecha pasada) y aún no están
// completamente pagadas, a partir de la próxima cuota pendiente en adelante.
function cuotasVencidas(r){
  if(!r || !r.tabla || !r.tabla.length) return 0;
  const hoy = hoyISO();
  let n = 0;
  for(let i=r.pagosHechos; i<r.tabla.length; i++){
    if(r.tabla[i].fecha < hoy) n++; else break;
  }
  return n;
}
// Calcula cuánto corresponde pagar en total para ponerse al día: si solo está pendiente
// la cuota en curso (aún no vencida o recién vencida) es lo mismo de siempre, pero si ya
// se acumulan varias cuotas vencidas suma el monto de todas ellas, y calcula la mora de
// cada una según sus propios días de atraso (no solo los de la más próxima).
function calcularPendiente(p, r){
  const tasaMora = Number(state.config.tasaMoraDiaria)||0;
  const nVenc = cuotasVencidas(r);
  const diasAtr = r.proximaFecha ? diasAtraso(r.proximaFecha) : 0;
  let monto = r.faltaEnCuotaActual || r.cuota || 0;
  let mora = 0;
  if(r.proximaFecha && tasaMora>0 && diasAtr>0){
    // La mora se cobra sobre lo que REALMENTE falta de la cuota, no sobre su monto original.
    // Si el cliente ya abonó parte de esa cuota (r.faltaEnCuotaActual), esa parte ya la pagó —
    // cobrarle mora sobre el monto completo la cobraría dos veces sobre dinero que ya entregó.
    const baseMora = r.cuotaActual ? (r.faltaEnCuotaActual || 0) : (r.cuota||0);
    mora += round2(baseMora*tasaMora/100*diasAtr);
  }
  for(let i=1;i<nVenc;i++){
    const fila = r.tabla[r.pagosHechos+i];
    if(!fila) break;
    monto += fila.cuota;
    if(tasaMora>0){
      const diasAtrFila = diasAtraso(fila.fecha);
      if(diasAtrFila>0) mora += round2(fila.cuota*tasaMora/100*diasAtrFila);
    }
  }
  return { monto: round2(monto), mora: round2(mora), nVenc, diasAtr };
}
function mensajePendiente(p, cli, r){
  const cuota = money(r.cuotaActual ? r.cuotaActual.cuota : r.cuota);
  const nombre = cli ? cli.nombre.split(" ")[0] : "";
  const plantilla = (state.config.mensajePendiente || "").trim() || PLANTILLA_PENDIENTE_DEFECTO;
  return plantilla
    .replace(/\{nombre\}/g, nombre)
    .replace(/\{codigo\}/g, p.codigo)
    .replace(/\{cuota\}/g, cuota)
    .replace(/\{fecha\}/g, fmtDate(r.proximaFecha))
    .replace(/\{negocio\}/g, nombreApp());
}
function mensajeRecordatorio(p, cli, r, atraso, pendiente){
  const cuota = money(r.cuotaActual ? r.cuotaActual.cuota : r.cuota);
  const nombre = cli ? cli.nombre.split(" ")[0] : "";
  pendiente = pendiente || { monto: r.cuotaActual ? r.cuotaActual.cuota : r.cuota, mora: 0, nVenc: 1 };
  const montoTotal = money(round2((pendiente.monto||0) + (pendiente.mora||0)));
  const nVenc = pendiente.nVenc||1;
  const cuotasTexto = `${nVenc} cuota${nVenc===1?"":"s"}`;
  const plantilla = (state.config.mensajeRecordatorio || "").trim() || PLANTILLA_RECORDATORIO_DEFECTO;
  return plantilla
    .replace(/\{nombre\}/g, nombre)
    .replace(/\{codigo\}/g, p.codigo)
    .replace(/\{cuota\}/g, cuota)
    .replace(/\{monto\}/g, montoTotal)
    .replace(/\{cuotas\}/g, cuotasTexto)
    .replace(/\{fecha\}/g, fmtDate(r.proximaFecha))
    .replace(/\{dias\}/g, `${atraso} día${atraso===1?"":"s"}`)
    .replace(/\{negocio\}/g, nombreApp());
}

             <p style="font-size:13px;margin:0;">Pago único al final (capital + interés): <b>${money(tabla[tabla.length-1].cuota)}</b></p>`
          : `<p style="font-size:13px;margin:0 0 4px;">Cuota ${esIndef?"por período":"(1ª)"}: <b>${money(tabla[0].cuota)}</b></p>

      clasificacionHtml = `<div class="card" style="background:${evalNIF.esSustancial?'#FBF3E4':'#EAF3DE'};margin-bottom:16px;color:#333;">
        <p style="font-size:12px;font-weight:700;margin:0 0 4px;color:${evalNIF.esSustancial?'#8A6416':'#3B6D11'};">Clasificación NIF C-19: ${evalNIF.esSustancial?"Modificación sustancial":"Modificación NO sustancial"}</p>
        <p style="font-size:12px;margin:0 0 4px;color:#333;">${evalNIF.diffPct===null ? "No hay un capital neto válido contra el cual comparar; se trata como préstamo nuevo por prudencia." : `El valor presente de los pagos nuevos (descontado a la tasa original) difiere ${(evalNIF.diffPct*100).toFixed(1)}% del capital que queda como base después del enganche/monto adicional (umbral ${umbralActualVista}%). ${evalNIF.esSustancial ? "Como la diferencia llega o supera el umbral, se da de baja el préstamo anterior y este se registra como préstamo nuevo." : "Como está por debajo del umbral, se reconoce como ajuste del mismo préstamo (no se crea un préstamo nuevo)."}`}</p>
        ${(!evalNIF.esSustancial && evalNIF.diffPct!==null) ? `<p style="font-size:13px;margin:0;color:#333;">${evalNIF.gananciaPerdida>=0?"Ganancia":"Pérdida"} por modificación a reconocer: <b style="color:${evalNIF.gananciaPerdida>=0?'#3B6D11':'#A32D2D'}">${money(Math.abs(evalNIF.gananciaPerdida))}</b></p>` : ""}

  return `

    <label><span>Enganche / abono que reduce el préstamo (L, opcional)</span><input id="rf_enganche" type="text" inputmode="decimal" value="${f.enganche}" oninput="window._rf.enganche=filtrarDecimal(this.value); render()"></label>

      <button class="btn btn-gold" onclick="guardarRefinanciamiento()" ${nuevoCapital<=0?"disabled style='opacity:.4'":""}>Confirmar refinanciamiento</button>
    </div>`;
}
function guardarRefinanciamiento(){
  const f = window._rf;
  const origen = state.prestamos.find(x=>x.id===f.origenId);
  if(!origen) return;
  const esIndef = f.metodo === METODOS[5];
  if(!f.tasa || (!esIndef && !f.cuotas)) return;
  const r = resumen(origen);
  const capitalPendiente = r.capitalPendiente || 0;
  const enganche = Number(f.enganche)||0;
  const adicional = Number(f.adicional)||0;
  const nuevoCapital = Math.max(0, capitalPendiente - enganche + adicional);
  if(nuevoCapital<=0) return;

  const tablaNueva = generarTabla({capital:nuevoCapital, tasa:f.tasa, cuotas: esIndef?1:f.cuotas, periodo:f.periodo, metodo:f.metodo, fechaInicio:f.fechaInicio});
  const evalNIF = evaluarModificacionNIF(origen, nuevoCapital, tablaNueva.map(x=>x.cuota), {esIndefinidoNuevo: esIndef});

  const notaNIF = evalNIF.diffPct===null
    ? ""
    : `\n\nClasificación NIF C-19: ${evalNIF.esSustancial ? "Modificación sustancial (se da de baja el préstamo anterior)" : `Modificación NO sustancial — ${evalNIF.gananciaPerdida>=0?"ganancia":"pérdida"} por modificación de ${money(Math.abs(evalNIF.gananciaPerdida))}`}`;

  mostrarConfirmacion(`Vas a refinanciar ${origen.codigo}:\nCapital pendiente: ${money(capitalPendiente)}\nEnganche/abono: ${money(enganche)}\nMonto adicional entregado: ${money(adicional)}\nNuevo capital: ${money(nuevoCapital)}${notaNIF}\n\n¿Confirmas?`, function(ok){
    if(!ok) return;

    // Según NIF C-19: solo si la modificación es SUSTANCIAL (diferencia de valor presente
    // igual o mayor al umbral) se da de baja el préstamo anterior y se crea uno nuevo. Si es
    // NO sustancial (por debajo del umbral), no se crea préstamo nuevo: se ajustan las
    // condiciones del mismo préstamo y la diferencia se reconoce de inmediato como
    // ganancia o pérdida por modificación.
    const esSustancial = evalNIF.diffPct===null ? true : evalNIF.esSustancial;

    if(esSustancial){
      origen.refinanciado = true;
      origen.fechaRefinanciado = f.fechaInicio;

      const codigo = nextCode("P", state.prestamos);
      const nuevo = {
        id: uid(), codigo, clienteId: origen.clienteId, capital: nuevoCapital, tasa: f.tasa,
        periodo: f.periodo, metodo: f.metodo, fechaInicio: f.fechaInicio,
        cuotas: esIndef?0:Number(f.cuotas), pagos: [],
        refinanciaDe: origen.id, engancheAlRefinanciar: enganche, adicionalAlRefinanciar: adicional,
        tipoModificacionNIF: "sustancial",
        gananciaPerdidaModificacionNIF: 0
      };
      state.prestamos.push(nuevo);
      window._rf = null;
      state.seleccionId = nuevo.id;
      state.vista = "detalle";
    } else {
      origen.modificaciones = origen.modificaciones || [];
      origen.modificaciones.push({
        fecha: f.fechaInicio,
        capitalAnterior: origen.capital, tasaAnterior: origen.tasa, periodoAnterior: origen.periodo,
        metodoAnterior: origen.metodo, cuotasAnterior: origen.cuotas, fechaInicioAnterior: origen.fechaInicio,
        capitalNuevo: nuevoCapital, tasaNueva: f.tasa, periodoNuevo: f.periodo,
        metodoNuevo: f.metodo, cuotasNuevo: esIndef?0:Number(f.cuotas),
        enganche, adicional, diffPct: evalNIF.diffPct, gananciaPerdida: evalNIF.gananciaPerdida,
        // Guardamos el historial de pagos/ajustes de ANTES de este refinanciamiento solo
        // como respaldo/auditoría. capitalPendiente (arriba) YA restó todo lo abonado hasta
        // hoy para calcular nuevoCapital, así que ese historial no debe seguir contando
        // contra la tabla nueva (si se dejara, el mismo pago quedaría acreditado dos veces:
        // una al calcular capitalPendiente y otra al recalcular la tabla — esto es justo lo
        // que causaba que un pago viejo apareciera como "abono a la primera cuota" nueva).
        pagosPrevios: origen.pagos || [], ajustesPrevios: origen.ajustesCapital || []
      });
      origen.capital = nuevoCapital;
      origen.tasa = f.tasa;
      origen.periodo = f.periodo;
      origen.metodo = f.metodo;
      origen.cuotas = esIndef?0:Number(f.cuotas);
      origen.fechaInicio = f.fechaInicio;
      origen.pagos = [];
      origen.ajustesCapital = [];
      window._rf = null;
      state.seleccionId = origen.id;
      state.vista = "detalle";
    }
    save(); render();
  }, { textoAceptar:"Confirmar" });
}

function viewDetallePrestamo(){
  const p = state.prestamos.find(x=>x.id===state.seleccionId);
  if(!p){ state.vista="lista"; return viewPrestamos(); }
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const r = resumen(p);
  const atraso = r.proximaFecha ? diasAtraso(r.proximaFecha) : 0;

  // El método Indefinido no tiene número de cuotas fijo, pero ahora sí se muestra un
  // historial real: la fila de un período nuevo se crea el día DESPUÉS de la fecha de la
  // cuota anterior (no espera hasta casi vencer ella misma) — así, en cuanto se resuelve un
  // período, ya queda lista/visible la fila del que sigue. Se va quedando en la tabla ya
  // como período pagado o pendiente, en vez de mostrar de una vez varias filas futuras que
  // todavía no tocan, o esconder todo detrás de una sola fila fija.
  const esIndefDetalle = p.metodo === METODOS[5];
  const filasParaTabla = esIndefDetalle
    ? (function(){
        const hoy = hoyISO();
        const visibles = r.tabla.filter((f,i)=> i===0 || addDays(r.tabla[i-1].fecha,1) <= hoy);
        return visibles.length ? visibles : [r.tabla[0]];
      })()
    : r.tabla;
  // Filas donde cayó un abono a capital extra (ajustesCapital), para resaltarlas en la
  // tabla: el número de fila coincide con "despuesDeFila" porque ahí es donde el motor
  // dinámico (generarTablaDinamica) suma ese abono extra al abono programado de esa fila.
  const filasConAjuste = new Set((p.ajustesCapital||[]).map(a=>a.despuesDeFila));
  let filasHtml = filasParaTabla.map((f,i)=>{
    let estadoCelda;
    if(i < r.pagosHechos) estadoCelda = '<span style="color:#3B6D11">✓ Pagada</span>';
    else if(i === r.pagosHechos && r.abonadoEnCuotaActual>0) estadoCelda = `<span style="color:${GOLD};">Abono ${money(r.abonadoEnCuotaActual)}</span>`;
    else estadoCelda = '<span style="color:#bbb">—</span>';
    const tieneAjuste = filasConAjuste.has(f.n);
    return `<tr class="fila-amort${tieneAjuste?' fila-ajuste':''}">
      <td style="padding:4px 6px;">${f.n}${tieneAjuste?' <span title="Incluye abono a capital" style="color:#3B6D11;font-weight:700;">*</span>':''}</td>
      <td style="padding:4px 6px;white-space:nowrap;">${fmtDateCompacto(f.fecha)}</td>
      <td style="padding:4px 6px;text-align:right">${money(f.saldoInicial)}</td>
      <td style="padding:4px 6px;text-align:right">${money(f.cuota)}</td>
      <td style="padding:4px 6px;text-align:right">${money(f.interes)}</td>
      <td style="padding:4px 6px;text-align:right${tieneAjuste?';color:#3B6D11;font-weight:700;':''}">${money(f.abono)}</td>
      <td style="padding:4px 6px;text-align:right">${money(f.saldo)}</td>
      <td style="padding:4px 6px;white-space:nowrap;">${estadoCelda}</td>
    </tr>`;
  }).join("");
  const totalCuota = filasParaTabla.reduce((s,f)=>s+(Number(f.cuota)||0),0);
  const totalInteres = filasParaTabla.reduce((s,f)=>s+(Number(f.interes)||0),0);
  const totalAbono = filasParaTabla.reduce((s,f)=>s+(Number(f.abono)||0),0);
  const filaTotales = esIndefDetalle ? "" : `<tr class="fila-total-amort" style="font-weight:700;">
    <td colspan="3" style="padding:5px 6px;">Total</td>
    <td style="padding:5px 6px;text-align:right">${money(totalCuota)}</td>
    <td style="padding:5px 6px;text-align:right">${money(totalInteres)}</td>
    <td style="padding:5px 6px;text-align:right">${money(totalAbono)}</td>
    <td></td><td></td>
  </tr>`;

  const pendiente = calcularPendiente(p, r);
  const sugerido = pendiente.monto;
  const moraCalc = pendiente.mora;
  const nVenc = pendiente.nVenc;
  const esBullet = p.metodo === METODOS[3] || p.metodo === METODOS[4];

  const diasFaltan = r.proximaFecha ? diasParaVencer(r.proximaFecha) : null;
  const necesitaRecordatorio = r.estado==="Activo" && r.proximaFecha && (atraso>0 || diasFaltan===1 || diasFaltan===0);
  let waRec = null, smsRec = null;
  if(necesitaRecordatorio){
    const mensajeRec = atraso>0 ? mensajeRecordatorio(p, cli, r, atraso, pendiente) : mensajePendiente(p, cli, r);
    waRec = linkWhatsapp(cli, mensajeRec);

  return `

      <p style="color:#fff;font-size:22px;font-weight:700;margin:4px 0 0;">${money(r.saldoPendiente)}</p>
      <p style="color:rgba(255,255,255,.7);font-size:12px;margin:2px 0 10px;">saldo pendiente</p>
      <div class="flex-gap">${badge(atraso>0?"Vencido":r.estado)}<span style="color:rgba(255,255,255,.7);font-size:12px;">${p.metodo}</span></div>

      <div class="card" style="border:1px solid #e5e1d8;"><p class="lbl">Cuotas pagadas</p><p style="font-size:15px;font-weight:600;margin:0;">${r.pagosHechos}${p.metodo.includes("Indefinido")?"":" / "+p.cuotas}</p></div>
    </div>
    ${necesitaRecordatorio ? `
    <div class="row-card" style="display:block;">
      <p style="font-weight:700;margin:0 0 6px;color:#A32D2D;">${atraso>0 ? `Cuota vencida (${atraso} día${atraso===1?"":"s"} · ${nVenc} cuota${nVenc===1?"":"s"})` : (diasFaltan===0 ? "Por cobrar hoy" : "Por cobrar mañana")}</p>
      ${(waRec||smsRec) ? `<div class="flexrow">
        ${waRec?`<a class="btn btn-outline" style="text-decoration:none;text-align:center;" href="${waRec}" target="_blank" rel="noopener">Enviar WhatsApp</a>`:""}
        ${smsRec?`<a class="btn btn-outline" style="text-decoration:none;text-align:center;" href="${smsRec}">Enviar SMS</a>`:""}

    </div>` : ""}
    ${r.estado==="Activo" ? `

      ${r.abonadoEnCuotaActual>0 ? `<p class="hint" style="color:#8A6416;margin:0 0 10px;">Ya abonaste ${money(r.abonadoEnCuotaActual)} a esta cuota. Falta ${money(r.faltaEnCuotaActual)}.</p>` : ""}

    </div>
    ${esBullet ? `

function cargarScript(src, cb){
  const s = document.createElement("script");
  s.src = src;
  s.onload = cb;
  s.onerror = function(){ mostrarAlerta("No se pudo cargar un componente necesario para generar el PDF. Revisa tu conexión a internet e intenta de nuevo."); };
  document.head.appendChild(s);
}
function cargarPDFLibs(cb){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable){ cb(); return; }
  cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", function(){
    cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js", cb);
  });
}
async function compartirOdescargarPDF(blob, nombreArchivo, tituloCompartir){
  try{
    const archivo = new File([blob], nombreArchivo, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title: tituloCompartir});
      return;
    }
  }catch(err){
    if(err && err.name === "AbortError") return; // el usuario cerró el cuadro de compartir, sin problema
  }
  // Respaldo: si no se puede compartir directo, se descarga para compartirlo manualmente después.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function generarAmortizacionPDF(p, cli, r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(nombreApp(), 14, 16);
  doc.setFontSize(9);
  doc.text(`${p.codigo}  ·  ${cli?cli.nombre:"—"}  ·  Capital ${money(p.capital)}  ·  Tasa ${p.tasa}%  ·  ${p.periodo}  ·  ${p.metodo}`, 14, 23);
  const esIndefPDF = p.metodo === METODOS[5];
  const filasBase = esIndefPDF
    ? (function(){
        const hoy = hoyISO();
        const visibles = r.tabla.filter((f,i)=> i===0 || addDays(r.tabla[i-1].fecha,1) <= hoy);
        return visibles.length ? visibles : [r.tabla[0]];
      })()
    : r.tabla;
  let startY = 28;
  if(esIndefPDF){
    doc.setFontSize(8);
    doc.text("Préstamo de plazo indefinido: solo interés cada período, sin fecha de finalización fija.", 14, startY);
    startY += 5;
  }
  const filasConAjustePDF = new Set((p.ajustesCapital||[]).map(a=>a.despuesDeFila));
  const filas = filasBase.map((f,i)=>{
    const tieneAjuste = filasConAjustePDF.has(f.n);
    const estado = i < r.pagosHechos ? "Pagada" : (i===r.pagosHechos && r.abonadoEnCuotaActual>0 ? `Abono ${money(r.abonadoEnCuotaActual)}` : "Pendiente");
    return [f.n, fmtDateCompacto(f.fecha), money(f.saldoInicial), money(f.cuota), money(f.interes), tieneAjuste?`${money(f.abono)} *`:money(f.abono), money(f.saldo), estado];
  });
  const totalCuota = filasBase.reduce((s,f)=>s+(Number(f.cuota)||0),0);
  const totalInteres = filasBase.reduce((s,f)=>s+(Number(f.interes)||0),0);
  const totalAbono = filasBase.reduce((s,f)=>s+(Number(f.abono)||0),0);
  doc.autoTable({
    startY,
    head: [["N°","Fecha","Saldo ini.","Cuota","Interés","Abono","Pendiente","Estado"]],
    body: filas,
    foot: esIndefPDF ? undefined : [["Total","","",money(totalCuota),money(totalInteres),money(totalAbono),"",""]],
    styles: { fontSize: 8, cellPadding: 2 },
    headStyles: { fillColor: [27,42,74] },
    footStyles: { fillColor: [245,243,238], textColor: [20,20,20], fontStyle: "bold" },
    didParseCell: function(data){
      if(data.section==="body"){
        const fila = filasBase[data.row.index];
        if(fila && filasConAjustePDF.has(fila.n)){
          data.cell.styles.fillColor = [235,245,227];
          if(data.column.index===5){ data.cell.styles.textColor=[59,109,17]; data.cell.styles.fontStyle="bold"; }
        }
      }
    }
  });
  if(filasConAjustePDF.size>0){
    const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY : startY;
    doc.setFontSize(8);
    doc.setTextColor(59,109,17);
    doc.text("* Incluye un abono a capital extra además de la cuota normal.", 14, finalY+6);
    doc.setTextColor(0,0,0);
  }
  return doc;
}

function dibujarMarcaAgua(doc, texto, w, h){
  // Marca de agua tenue de fondo (iniciales del negocio), en diagonal. Si el navegador no
  // soporta la API de transparencia de jsPDF, simplemente se omite sin romper el recibo.
  try{
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({opacity:0.07}));
    doc.setFont("helvetica","bold");
    doc.setFontSize(60);
    doc.setTextColor(27,42,74);
    doc.text(texto, w/2, h/2, {align:"center", angle:45});
    doc.restoreGraphicsState();
    doc.setFont("helvetica","normal");
    doc.setTextColor(20);
  }catch(err){ /* sin marca de agua si el navegador no soporta GState */ }
}
function conceptoPago(pg){
  if(pg.liquidacion) return "Liquidación anticipada";
  if(pg.tipo === "abono_capital") return "Abono a capital";
  if(pg.mora>0) return "Cuota + mora por atraso";
  return "Cuota";
}
function generarReciboPDF(p, cli, pg, r, numRecibo, contexto){
  const { jsPDF } = window.jspdf; // tamaño angosto de recibo/ticket (80mm), no una hoja completa
  const doc = new jsPDF({unit:"mm", format:[80,170]});
  dibujarMarcaAgua(doc, siglasApp(), 80, 170);
  const totalPago = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const concepto = conceptoPago(pg);
  const cx = 40, xL = 6, xR = 74;
  let y = 10;
  doc.setFontSize(12); doc.text(nombreApp().toUpperCase(), cx, y, {align:"center"}); y += 6;
  doc.setFontSize(8); doc.setTextColor(120); doc.text("Recibo de pago", cx, y, {align:"center"}); doc.setTextColor(20); y += 5;
  doc.setDrawColor(190); doc.line(xL, y, xR, y); y += 6;
  doc.setFontSize(9);
  const linea = (label, valor) => { doc.text(label, xL, y); doc.text(String(valor), xR, y, {align:"right"}); y += 6; };
  linea("No. recibo", "R-"+numRecibo);
  linea("Fecha", fmtDate(pg.fecha));
  linea("Cliente", cli?cli.nombre:"—");
  if(cli && cli.cedula) linea("Cédula", cli.cedula);
  linea("Préstamo", p.codigo);

  linea("Concepto", concepto);
  if(pg.mora>0){ linea("Cuota", money(pg.monto)); linea("Mora", money(pg.mora)); }
  y += 1; doc.setDrawColor(190); doc.line(xL, y, xR, y); y += 7;
  doc.setFontSize(11); linea("Total pagado", money(totalPago));
  doc.setFontSize(8); linea("Saldo pendiente", money(r.saldoPendiente));
  y += 6; doc.setFontSize(8); doc.text("Gracias por su pago.", cx, y, {align:"center"});
  const modoFirma = state.config.reciboFirma || "automatico";
  const usarFirma = modoFirma==="firma" || (modoFirma==="automatico" && contexto==="imprimir");
  const usarSinFirma = modoFirma==="sinfirma" || (modoFirma==="automatico" && contexto!=="imprimir");
  if(usarFirma){
    y += 14;
    doc.setDrawColor(120); doc.line(xL+6, y, xR-6, y);
    y += 4; doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text("Firma de quien recibe el pago", cx, y, {align:"center"});
    doc.setTextColor(20);
  } else if(usarSinFirma){
    y += 9; doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text("Recibo válido sin firma.", cx, y, {align:"center"});
    doc.setTextColor(20);
  }
  return doc;
}

function registrarPago(id){
  const p = state.prestamos.find(x=>x.id===id);
  const r = resumen(p);
  const pendiente = calcularPendiente(p, r);
  let mora = pendiente.mora;
  if(mora>0){
    const chk = document.getElementById("incluirMora");
    if(chk && !chk.checked) mora = 0;
  }
  const val = document.getElementById("montoPago").value;
  const sugerido = pendiente.monto;
  // El campo de monto ahora puede traer la mora ya incluida (si la casilla está marcada),
  // así que primero se descuenta la mora para saber cuánto corresponde a cuota/abono, y así
  // no se confunda la mora con un abono a capital.
  const montoIngresado = val ? Number(val) : round2(sugerido + mora);
  if(!montoIngresado || montoIngresado<=0) return;
  const montoSinMora = round2(Math.max(0, montoIngresado - mora));

  // Un abono a capital es pagar más de lo que falta para completar la cuota actual (después
  // de dejarla en cero). Antes esto solo se permitía el día exacto de la cuota; ahora se
  // acepta cualquier día, para poder recibir abonos adelantados cuando el cliente se acerque.
  const excedente = round2(Math.max(0, montoSinMora - sugerido));

  const montoCuota = excedente > 0.01 ? sugerido : montoSinMora;
  const total = montoIngresado;
  const fEl0 = document.getElementById("fechaPago");
  const fechaElegida = (fEl0 && fEl0.value) ? fEl0.value : hoyISO();
  const etiquetaCuota = pendiente.nVenc>1 ? `Cuotas vencidas (${pendiente.nVenc})` : "Cuota";
  let msgConfirm = `¿Registrar este pago con fecha ${fmtDate(fechaElegida)}?\n\n${etiquetaCuota}: ${money(montoCuota)}`;
  if(excedente > 0.01) msgConfirm += `\nAbono a capital: ${money(excedente)}`;
  if(mora>0) msgConfirm += `\nMora: ${money(mora)}`;
  msgConfirm += `\nTotal: ${money(total)}`;
  mostrarConfirmacion(msgConfirm, function(ok){
    if(!ok) return;
    p.pagos = p.pagos || [];
    const fEl = document.getElementById("fechaPago");
    const fechaPago = (fEl && fEl.value) ? fEl.value : hoyISO();
    p.pagos.push({ id:uid(), fecha:fechaPago, monto:montoCuota, mora, tipo:"cuota" });
    if(excedente > 0.01){
      const idAbono = uid();
      p.pagos.push({ id:idAbono, fecha:fechaPago, monto:excedente, mora:0, tipo:"abono_capital" });
      // Registrar el abono como un ajuste real de saldo (no solo un pago más), para que
      // generarTablaDinamica() recalcule cuota/plazo según el método a partir de aquí.
      // Si el abono alcanza para cubrir todo el saldo pendiente, se marca como liquidado
      // en vez de dejar un ajuste que dejaría filas "fantasma" en cero.
      const saldoAntes = r.capitalPendiente!=null ? r.capitalPendiente : Number(p.capital)||0;
      if(round2(saldoAntes - excedente) <= 0.01){
        p.liquidadoAnticipado = true;
      } else {
        // OJO: el ajuste debe aplicarse DESPUÉS de la(s) cuota(s) que se completan en este
        // mismo pago (r.pagosHechos + pendiente.nVenc), no antes (r.pagosHechos a secas).
        // Como excedente>0 implica que montoCuota=sugerido pagó exactamente esas nVenc
        // cuotas completas, esta fila que se está pagando ya generó su interés — el abono
        // a capital solo debe bajar el saldo de ahí en adelante, para la SIGUIENTE cuota.
        // Aplicarlo antes (como se hacía) le restaba interés a una cuota ya devengada.
        // pagoId enlaza este ajuste con el pago de arriba, para poder deshacer ambos juntos
        // si el pago se llega a eliminar más adelante (ver eliminarPago).
        p.ajustesCapital = p.ajustesCapital || [];
        p.ajustesCapital.push({ despuesDeFila: (r.pagosHechos||0) + pendiente.nVenc, monto: excedente, fecha: fechaPago, pagoId: idAbono });
      }
    }
    save(); render();
    const r2 = resumen(p);
    let msg = `✅ Pago registrado: ${money(total)}`;
    if(mora>0) msg += ` (incluye mora de ${money(mora)})`;
    if(excedente > 0.01) msg += `\nIncluye abono a capital de ${money(excedente)}.`;
    msg += ".\n\n";
    if(r2.estado==="Pagado"){
      msg += "¡Este préstamo quedó completamente pagado! 🎉";
    } else {
      msg += `Saldo pendiente: ${money(r2.saldoPendiente)}.`;
      if(r2.abonadoEnCuotaActual>0) msg += `\nLlevas abonado ${money(r2.abonadoEnCuotaActual)} de la próxima cuota (falta ${money(r2.faltaEnCuotaActual)}).`;
      if(r2.proximaFecha) msg += `\nPróxima cuota: ${fmtDate(r2.proximaFecha)}.`;
    }
    mostrarAlerta(msg);
  }, { textoAceptar:"Registrar" });
}
function liquidarAnticipado(id){
  const p = state.prestamos.find(x=>x.id===id);
  const r = resumen(p);
  const fechaLiq = document.getElementById("fechaLiquidacion").value || hoyISO();
  const diasPeriodo = DIAS_PERIODO[p.periodo] || 30;
  const tasaDiaria = (Number(p.tasa)||0)/100/diasPeriodo;
  const fechaBase = r.pagosHechos>0 ? r.tabla[r.pagosHechos-1].fecha : p.fechaInicio;
  const diasReales = Math.max(0, Math.round((new Date(fechaLiq+"T00:00:00") - new Date(fechaBase+"T00:00:00"))/86400000));
  const capitalPendiente = Number(p.capital)||0;
  const interes = Math.round(capitalPendiente*tasaDiaria*diasReales*100)/100;
  const total = capitalPendiente + interes;
  mostrarConfirmacion(
    `Liquidación anticipada al ${fmtDate(fechaLiq)}:\n` +
    `Días reales transcurridos: ${diasReales}\n` +
    `Interés prorateado: ${money(interes)}\n` +
    `Capital pendiente: ${money(capitalPendiente)}\n` +
    `Total a pagar: ${money(total)}\n\n` +
    `¿Registrar este pago y cerrar el préstamo?`,
    function(ok){
      if(!ok) return;
      p.pagos = p.pagos || [];
      p.pagos.push({ id:uid(), fecha:fechaLiq, monto:total, mora:0, liquidacion:true });
      p.liquidadoAnticipado = true;
      save(); render();
    },
    { textoAceptar:"Registrar y cerrar" }
  );
}
// Deshace la ÚLTIMA modificación "no sustancial" (NIF C-19) aplicada a este préstamo —
// la que ajustó sus condiciones EN EL MISMO préstamo (sin crear uno nuevo). Restaura
// capital, tasa, periodo, método, cuotas, fecha de inicio y el historial de pagos/abonos
// que tenía justo antes de esa modificación, y quita esa entrada del historial.
// Esto es lo que hay que usar para "deshacer" una modificación no sustancial — eliminar
// el préstamo por completo NO la deshace, porque no se creó un préstamo nuevo aparte.
function deshacerUltimaModificacion(id){
  const p = state.prestamos.find(x=>x.id===id);
  if(!p || !p.modificaciones || !p.modificaciones.length) return;
  const m = p.modificaciones[p.modificaciones.length-1];
  const numPagosDesdeModificacion = (p.pagos||[]).length;
  let msg = `¿Deshacer la última modificación de ${p.codigo} (del ${fmtDate(m.fecha)})?\n\n`+
    `Volverá a quedar así:\nCapital: ${money(m.capitalAnterior)}\nTasa: ${m.tasaAnterior}%\n`+
    `${m.periodoAnterior} · ${m.metodoAnterior}${m.cuotasAnterior?` · ${m.cuotasAnterior} cuotas`:""}`;
  if(numPagosDesdeModificacion>0){
    msg += `\n\nOjo: tiene ${numPagosDesdeModificacion} pago(s) registrado(s) DESPUÉS de esa modificación — se perderán, porque vuelven a quedar sin sentido con las condiciones anteriores.`;
  }
  mostrarConfirmacion(msg, function(ok){
    if(!ok) return;
    p.capital = m.capitalAnterior;
    p.tasa = m.tasaAnterior;
    p.periodo = m.periodoAnterior;
    p.metodo = m.metodoAnterior;
    p.cuotas = m.cuotasAnterior;
    if(m.fechaInicioAnterior) p.fechaInicio = m.fechaInicioAnterior;
    p.pagos = m.pagosPrevios || [];
    p.ajustesCapital = m.ajustesPrevios || [];
    p.modificaciones.pop();
    save(); render();
    mostrarAlerta(`Listo, ${p.codigo} volvió a las condiciones que tenía antes de esa modificación.`);
  }, { textoAceptar:"Deshacer modificación", peligro:true });
}
function eliminarPrestamo(id){
  const p = state.prestamos.find(x=>x.id===id);
  if(!p) return;
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const numPagos = (p.pagos||[]).length;
  const origen = p.refinanciaDe ? state.prestamos.find(x=>x.id===p.refinanciaDe) : null;
  let msg = `¿Seguro que quieres eliminar el préstamo ${p.codigo}${cli?" de "+cli.nombre:""}? Esta acción no se puede deshacer.`;
  if(numPagos>0){
    msg = `El préstamo ${p.codigo}${cli?" de "+cli.nombre:""} tiene ${numPagos} pago(s) registrado(s). Si lo eliminas, se pierde también ese historial de pagos.\n\n`+
      `¿Seguro que quieres eliminarlo? Esta acción no se puede deshacer.`;
  }
  if(origen){
    msg += `\n\nEste préstamo nació de refinanciar ${origen.codigo}. Al eliminarlo, ${origen.codigo} volverá a quedar Activo con el saldo e historial que tenía justo antes de ese refinanciamiento.`;
  }
  if(p.modificaciones && p.modificaciones.length){
    msg += `\n\nOjo: este préstamo tiene ${p.modificaciones.length} modificación(es) de condiciones (NIF C-19, no sustancial) guardadas en su propio historial. Eliminar el préstamo borra ese historial para siempre — si lo que quieres es volver a las condiciones anteriores a la última modificación, usa "Deshacer última modificación" en vez de eliminar.`;
  }
  confirmarConClave(msg, function(ok){
    if(!ok) return;
    if(origen){
      origen.refinanciado = false;
      delete origen.fechaRefinanciado;
    }
    state.prestamos = state.prestamos.filter(x=>x.id!==id);
    state.vista = "lista";
    save(); render();
  }, { textoAceptar:"Eliminar", peligro:true });
}

function viewPagos(){
  if(state.vista==="recibo") return viewRecibo();
  let lista = [];
  const previos = [];
  const enganches = [];
  state.prestamos.forEach(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    (p.pagos||[]).forEach(pg=> lista.push({...pg, codigo:p.codigo, nombre:cli?cli.nombre:"—", prestamoId:p.id}));
    // El enganche al refinanciar/modificar es dinero cobrado igual que un pago, aunque no
    // vive en p.pagos — se muestra aparte, en su propia tarjeta desplegable (no es un pago
    // vigente más ni un registro con recibo/borrado independiente).
    if(p.refinanciaDe && Number(p.engancheAlRefinanciar)>0){
      const origen = state.prestamos.find(x=>x.id===p.refinanciaDe);
      enganches.push({
        fecha: p.fechaInicio, monto: Number(p.engancheAlRefinanciar)||0,
        etiqueta: `Enganche al refinanciar${origen?" (de "+origen.codigo+")":""}`,
        codigo: p.codigo, nombre: cli?cli.nombre:"—"
      });
    }
    (p.modificaciones||[]).forEach(m=>{
      if(Number(m.enganche)>0){
        enganches.push({
          fecha: m.fecha, monto: Number(m.enganche)||0,
          etiqueta: "Enganche al modificar", codigo: p.codigo, nombre: cli?cli.nombre:"—"
        });
      }
      // Pagos hechos ANTES de una modificación "no sustancial" (NIF C-19): se archivan y ya
      // no cuentan contra la tabla actual, pero siguen siendo dinero cobrado — se muestran
      // aparte, en una lista desplegable, para no perderlos ni mezclarlos con lo vigente.
      (m.pagosPrevios||[]).forEach(pg=>{
        previos.push({...pg, codigo:p.codigo, nombre:cli?cli.nombre:"—", fechaModificacion:m.fecha});
      });
    });
  });
  lista.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  previos.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  enganches.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  // Tarjeta de fila reutilizable: el monto siempre a la derecha con un ancho mínimo fijo
  // (para que todos los montos queden alineados en la misma columna, sin importar cuántas
  // líneas ocupe el texto de la izquierda), y cada nota extra en su propia línea completa.
  const filaMovimiento = (nombre, lineas, monto, acciones, onclick)=>{
    const notas = lineas.filter(Boolean).map(l=>`<p class="sub">${l}</p>`).join("");
    const nombreDiv = onclick
      ? `<div style="cursor:pointer;min-width:0;" onclick="${onclick}"><p class="name">${nombre}</p>${notas}</div>`
      : `<div style="min-width:0;"><p class="name">${nombre}</p>${notas}</div>`;
    return `<div class="row-card" style="align-items:flex-start;">
    ${nombreDiv}
    <div style="text-align:right;display:flex;align-items:flex-start;gap:6px;flex-shrink:0;">
      <p style="font-size:15px;font-weight:600;color:#3B6D11;margin:0;min-width:86px;">${money(monto)}</p>
      ${acciones||""}
    </div>
  </div>`;
  };
  const filaPago = (pg)=>{
    const total = (Number(pg.monto)||0) + (Number(pg.mora)||0);
    let nota = null;
    if(pg.liquidacion) nota = "Liquidación anticipada";
    else if(pg.tipo === "abono_capital") nota = "Abono a capital";
    else if(pg.mora>0) nota = `Incluye mora ${money(pg.mora)}`;
    const acciones = `
      <button class="printbtn" title="Ver recibo" onclick="verRecibo('${pg.prestamoId}','${pg.id||""}')">🧾</button>
      <button class="printbtn" title="Eliminar pago" onclick="eliminarPago('${pg.prestamoId}','${pg.id||""}')">🗑</button>`;
    return filaMovimiento(pg.nombre, [`${pg.codigo} · ${fmtDate(pg.fecha)}`, nota], total, acciones, `verRecibo('${pg.prestamoId}','${pg.id||""}')`);
  };
  if(lista.length===0 && previos.length===0 && enganches.length===0) return `<p class="empty">Aún no se han registrado pagos.</p>`;
  const totalPrevios = previos.reduce((s,pg)=>s+(Number(pg.monto)||0)+(Number(pg.mora)||0),0);
  const totalEnganches = enganches.reduce((s,e)=>s+(Number(e.monto)||0),0);
  const desplegable = (id, titulo, cantidad, total, filasHtml)=> cantidad===0 ? "" : `
    <details class="tabla-card" style="margin:0 -16px 8px;border-radius:0;">
      <summary class="fila-header-desplegable" style="list-style:revert;padding:12px 16px;">
        <span>${titulo} <span class="hint" style="font-weight:400;">(${cantidad})</span></span>
        <span style="white-space:nowrap;">${money(total)}</span>
      </summary>
      <div style="padding:8px 16px;">${filasHtml}</div>
    </details>`;
  const filasPrevios = previos.map(pg=>{
    const total = (Number(pg.monto)||0) + (Number(pg.mora)||0);
    let nota = null;
    if(pg.liquidacion) nota = "Liquidación anticipada";
    else if(pg.tipo === "abono_capital") nota = "Abono a capital";
    else if(pg.mora>0) nota = `Incluye mora ${money(pg.mora)}`;
    return filaMovimiento(pg.nombre, [
      `${pg.codigo} · ${fmtDate(pg.fecha)}`,
      `Antes de modificar el ${fmtDateCompacto(pg.fechaModificacion)}`,
      nota
    ], total);
  }).join("");
  const filasEnganches = enganches.map(e=> filaMovimiento(e.nombre, [
    `${e.codigo} · ${fmtDate(e.fecha)}`,
    e.etiqueta
  ], e.monto)).join("");
  return `
    ${lista.length===0 ? `<p class="empty">Aún no se han registrado pagos vigentes.</p>` : (()=>{
      // Igual que Enganches y Pagos anteriores: se agrupan por préstamo en tarjetas
      // desplegables, en vez de una sola lista plana que crece sin parar con el tiempo.
      const grupos = {};
      lista.forEach(pg=>{
        if(!grupos[pg.prestamoId]) grupos[pg.prestamoId] = { codigo: pg.codigo, nombre: pg.nombre, pagos: [] };
        grupos[pg.prestamoId].pagos.push(pg);
      });
      // "lista" ya viene ordenada de más reciente a más antiguo, así que el primer pago de
      // cada grupo ya es el más reciente de ese préstamo — sirve para ordenar los grupos.
      const gruposOrdenados = Object.values(grupos).sort((a,b)=> new Date(b.pagos[0].fecha) - new Date(a.pagos[0].fecha));
      return gruposOrdenados.map(grupo=>{
        const totalGrupo = grupo.pagos.reduce((s,pg)=>s+(Number(pg.monto)||0)+(Number(pg.mora)||0),0);
        return desplegable(`prestamo-${grupo.codigo}`, `${grupo.codigo} · ${grupo.nombre}`, grupo.pagos.length, totalGrupo, grupo.pagos.map(filaPago).join(""));
      }).join("");
    })()}
    ${desplegable("enganches", "Enganches", enganches.length, totalEnganches, filasEnganches)}
    ${desplegable("previos", "Pagos anteriores a modificaciones", previos.length, totalPrevios, filasPrevios)}`;
}
function eliminarPago(prestamoId, pagoId){
  const p = state.prestamos.find(x=>x.id===prestamoId);
  if(!p) return;
  const pagos = p.pagos || [];
  const idx = pagoId ? pagos.findIndex(pg=>pg.id===pagoId) : pagos.length-1;
  if(idx<0) return;
  const pg = pagos[idx];
  const total = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  let msg = `¿Eliminar el pago de ${money(total)} del ${fmtDate(pg.fecha)} (${p.codigo}${cli?" · "+cli.nombre:""})?\n\n`+
    `El préstamo recalculará sus cuotas pendientes sin este pago. Esta acción no se puede deshacer.`;
  if(pg.tipo==="abono_capital") msg += `\n\nEste pago incluye un abono a capital — la tabla de amortización también se actualizará, quitando el efecto de ese abono.`;
  confirmarConClave(msg, function(ok){
    if(!ok) return;
    if(pg.liquidacion) p.liquidadoAnticipado = false;
    if(pg.tipo==="abono_capital" && (p.ajustesCapital||[]).length){
      // Se busca primero por el enlace directo (pagoId); si el ajuste es de antes de que
      // existiera ese enlace, se usa como respaldo la fecha+monto (que es como quedó
      // guardado el ajuste en ese momento) para no dejarlo huérfano en la tabla.
      const porId = p.ajustesCapital.findIndex(a=>a.pagoId===pg.id);
      if(porId>=0) p.ajustesCapital.splice(porId,1);
      else {
        const porFechaMonto = p.ajustesCapital.findIndex(a=>a.fecha===pg.fecha && round2(a.monto)===round2(pg.monto));
        if(porFechaMonto>=0) p.ajustesCapital.splice(porFechaMonto,1);
      }
    }
    // Si el préstamo estaba marcado como liquidado (por haber alcanzado el saldo completo
    // con un abono a capital, sin pasar por "Liquidar anticipado"), se destraba aquí también:
    // al quitar el pago, ya no es seguro que siga completamente pagado — resumen() vuelve a
    // calcular el estado real con lo que queda.
    if(p.liquidadoAnticipado) p.liquidadoAnticipado = false;
    pagos.splice(idx,1);
    p.pagos = pagos;
    if(state.vista==="recibo") state.vista = "lista";
    save(); render();
  }, { textoAceptar:"Eliminar", peligro:true });
}
function verRecibo(prestamoId, pagoId){
  state.tab = "pagos";
  state.vista = "recibo";
  state.reciboSel = { prestamoId, pagoId };
  render();
}
function viewRecibo(){
  const sel = state.reciboSel || {};
  const p = state.prestamos.find(x=>x.id===sel.prestamoId);
  if(!p){ state.vista="lista"; return viewPagos(); }
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const pagos = p.pagos || [];
  const idx = sel.pagoId ? pagos.findIndex(pg=>pg.id===sel.pagoId) : -1;
  const pg = idx>=0 ? pagos[idx] : pagos[pagos.length-1];
  if(!pg){ state.vista="lista"; return viewPagos(); }
  const numRecibo = pg.id ? pg.id.slice(-6).toUpperCase() : String(idx+1).padStart(4,"0");
  const totalPago = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const r = resumen(p);
  let concepto = conceptoPago(pg);

  return `
    <div id="recibo-imprimible" style="position:relative;overflow:hidden;">
      <span class="marca-agua">${siglasApp()}</span>
      <h2>${nombreApp().toUpperCase()}</h2>
      <p class="hint" style="margin:0 0 14px;">Recibo de pago</p>
      <div class="rline"><span>No. de recibo</span><b>R-${numRecibo}</b></div>
      <div class="rline"><span>Fecha</span><b>${fmtDate(pg.fecha)}</b></div>
      <div class="rline"><span>Cliente</span><b>${cli?cli.nombre:"—"}</b></div>
      ${cli && cli.cedula ? `<div class="rline"><span>Cédula</span><b>${cli.cedula}</b></div>` : ""}
      <div class="rline"><span>Préstamo</span><b>${p.codigo}</b></div>
      <div class="rline"><span>Método</span><b>${p.metodo}</b></div>
      <div class="rline"><span>Concepto</span><b>${concepto}</b></div>
      ${pg.mora>0 ? `<div class="rline"><span>Cuota</span><b>${money(pg.monto)}</b></div>
      <div class="rline"><span>Mora</span><b>${money(pg.mora)}</b></div>` : ""}
      <div class="rline rtotal" style="border-bottom:none;padding-top:14px;"><span>Total pagado</span><span>${money(totalPago)}</span></div>
      <div class="rline"><span>Saldo pendiente actual del préstamo</span><b>${money(r.saldoPendiente)}</b></div>
      <p class="hint" style="margin-top:18px;">Gracias por su pago.</p>
      ${(state.config.reciboFirma||"automatico")==="firma" ? `<div style="margin-top:26px;text-align:center;">
          <div style="border-top:1px solid #999;width:70%;margin:0 auto;"></div>
          <p class="hint" style="margin-top:4px;">Firma de quien recibe el pago</p>
        </div>` : ""}
      ${(state.config.reciboFirma||"automatico")==="sinfirma" ? `<p class="hint" style="margin-top:16px;text-align:center;">Recibo válido sin firma.</p>` : ""}
      ${(state.config.reciboFirma||"automatico")==="automatico" ? `<p class="hint" style="margin-top:16px;text-align:center;">Al imprimir sale con línea de firma · al enviarlo sale sin firma.</p>` : ""}
    </div>
    <div class="flexrow" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="state.vista='lista'; render();">Volver</button>
      <button class="btn btn-gold" onclick="imprimirRecibo()">Imprimir recibo</button>
    </div>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="compartirReciboPDF()">Compartir recibo en PDF</button>
    <button class="btn btn-danger" style="margin-top:10px;" onclick="eliminarPago('${p.id}','${pg.id||""}')">Eliminar este pago</button>`;
}


function viewTabbar(){
  const items = [["inicio","Inicio","home"],["clientes","Clientes","users"],["prestamos","Préstamos","landmark"],["pagos","Pagos","wallet"]];
  return `<div class="tabbar">${items.map(([id,label,icon])=>`
    <button class="tab-btn ${state.tab===id?"active":""}" onclick="state.tab='${id}'; state.vista='lista'; render()">
      ${ICONS[icon]}<span>${label}</span>
    </button>`).join("")}</div>`;
}

// Antes de salir de la app (cerrar la pestaña, recargar, o navegar a otra página) el
// navegador muestra su propio aviso de "¿Seguro que quieres salir?". No se puede cambiar el
// texto de ese aviso (los navegadores lo bloquean por seguridad, para que un sitio no pueda
// poner un mensaje falso/engañoso), pero sí se puede activar que aparezca. Aplica igual
// estando en cualquier pantalla o formulario de la app, no solo en la lista principal.
window.addEventListener("beforeunload", function(e){
  e.preventDefault();
  e.returnValue = "";
  return "";
});

// --- "Deslizar hacia abajo para actualizar" hecho a mano (en vez del gesto nativo del
// navegador) — así SÍ refresca (vuelve a leer los datos guardados y recalcula todo lo que
// depende de la fecha de hoy: cartera vencida, próximos a vencer, etc.) pero se queda en la
// misma pantalla en la que el usuario estaba, en vez de mandarlo siempre al inicio como
// hacía el gesto nativo del navegador (que overscroll-behavior, arriba, ya bloquea).
(function(){
  let indicador = null;
  function getIndicador(){
    if(!indicador){
      indicador = document.createElement("div");
      indicador.id = "pull-refresh-indicator";
      document.body.appendChild(indicador);
    }
    return indicador;
  }
  const UMBRAL = 70;
  let startY = null, jalando = false, disparado = false;
  document.addEventListener("touchstart", function(e){
    if(window.scrollY > 0){ startY = null; return; }
    if(e.touches.length !== 1) { startY = null; return; }
    startY = e.touches[0].clientY;
    jalando = false; disparado = false;
  }, { passive: true });
  document.addEventListener("touchmove", function(e){
    if(startY===null) return;
    const delta = e.touches[0].clientY - startY;
    if(delta <= 0){ jalando = false; return; }
    if(window.scrollY > 0){ startY = null; jalando = false; return; }
    jalando = true;
    if(!disparado){
      const ind = getIndicador();
      if(delta > UMBRAL){
        disparado = true;
        ind.classList.add("mostrando");
        ind.innerHTML = `<span class="spin"></span> Actualizando…`;
        refrescarSuave();
      }
    }
  }, { passive: true });
  document.addEventListener("touchend", function(){
    startY = null; jalando = false;
  }, { passive: true });
})();
function refrescarSuave(){
  // No pisa datos con lo de la nube (eso requiere confirmación porque reemplaza todo); solo
  // los vuelve a leer de este celular y recalcula/redibuja la pantalla actual con la fecha de
  // hoy. Si además hay nube configurada, aprovecha para traer lo último en silencio, igual
  // que al abrir la app.
  try{
    state.clientes = JSON.parse(localStorage.getItem(jrKey("jr_clientes")) || JSON.stringify(state.clientes));
    state.prestamos = JSON.parse(localStorage.getItem(jrKey("jr_prestamos")) || JSON.stringify(state.prestamos));
  }catch(e){}
  render();
  _autoCargaNubeHecha = false;
  Promise.resolve(autoCargarNubeAlAbrir()).catch(()=>{}).finally(function(){
    const ind = document.getElementById("pull-refresh-indicator");
    if(ind){
      setTimeout(function(){
        ind.classList.remove("mostrando");
      }, 350);
    }
  });
}

render();
</script>
